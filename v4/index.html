<!doctype html><meta charset="utf-8"><title>V4 Shadow</title><style>body{font:14px system-ui;margin:24px;color:#123}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccd;padding:6px;text-align:left} .a{color:#c22;font-weight:700}</style><h1>V4模型入选（纸面验证）</h1><div id="summary"></div><label><input id="ab" type="checkbox"> 只显示A/B</label><table><thead><tr><th>时间</th><th>比赛</th><th>状态</th><th>等级</th><th>球队</th><th>盘口</th><th>水位</th><th>EV</th><th>P(EV&gt;0)</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('./data/2026-09-13.json').then(r=>r.json()).then(d=>{let s=d.summary;summary.textContent=`列表日 ${d.list_date}｜computed ${s.computed}｜A ${s.A}｜B ${s.B}｜C ${s.C}｜N ${s.N}｜Neutral ${s.neutral}｜Not-prematch ${s.not_prematch}｜Missing ${s.missing_data}｜SHADOW ONLY`;let draw=()=>{rows.innerHTML=d.matches.filter(x=>!ab.checked||x.grade==='A'||x.grade==='B').map(x=>`<tr><td>${x.kickoff||''}</td><td>${x.market?.home_team||''} vs ${x.market?.away_team||''}</td><td>${x.analysis_status}</td><td class="a">${x.grade||''}</td><td>${x.selected_team||''}</td><td>${x.selected_handicap_signed??''}</td><td>${x.selected_water_hk??''}</td><td>${x.ev_mean??''}</td><td>${x.p_ev_positive??''}</td></tr>`).join('')};ab.onchange=draw;draw()})</script>
