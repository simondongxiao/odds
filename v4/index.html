<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>V4模型 Shadow 看板</title>
  <style>
    body{font:14px Arial,"Microsoft YaHei",sans-serif;margin:0;background:#f4f7fb;color:#17324d}
    .wrap{max-width:1500px;margin:0 auto;padding:18px}.hero{background:#1767a5;color:#fff;padding:16px 20px}
    .hero h1{margin:0 0 8px;font-size:25px}.hero a{color:#fff;margin-right:18px}
    .definitions{background:#fff;border:1px solid #c8d9e8;padding:12px 16px;line-height:1.8}
    .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#eaf2f9;padding:12px;border:1px solid #c8d9e8}
    .controls label{font-weight:700}.controls select{min-width:150px;padding:7px;border:1px solid #8bb3d3;background:#fff}
    .summary{margin:10px 0;padding:10px;background:#fff;border-left:5px solid #1767a5}.meta{font-size:12px;color:#526b7d;line-height:1.5}
    .table-wrap{overflow:auto;background:#fff;border:1px solid #c8d9e8}table{border-collapse:collapse;width:100%;min-width:1400px}
    th{background:#dcecf8;text-align:left}td,th{padding:8px;border:1px solid #d4e0ea;white-space:nowrap}
    .grade{font-weight:700}.grade-B{color:#b45309}.grade-C{color:#2563eb}.grade-N{color:#b91c1c}.status{color:#526b7d}.empty{padding:24px;text-align:center;color:#65798a}
  </style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <h1>V4模型入选（纸面验证）</h1>
    <div>V4 Shadow Only｜不构成真实下注建议｜real_money=false</div>
    <div style="margin-top:10px"><a href="./diagnostics/">V4诊断</a><a href="./expert/">V4独立专家选择器</a></div>
  </section>
  <section class="definitions">
    <b>等级定义：</b>A：EV均值&gt;0、EV P10&gt;0且P(EV&gt;0)≥95%；B：EV均值&gt;0且P(EV&gt;0)≥85%，但未达到A；C：EV均值&gt;0但未达到A/B；N：已完成真实概率计算但EV均值≤0。<br>
    <b>其他状态：</b>Neutral=盘口存在但没有可验证方向假设；数据缺失/非赛前不计入computed。P(EV&gt;0)不是比赛胜率。
  </section>
  <section class="controls">
    <label>列表日 <select id="date"></select></label>
    <label>北京时间开赛日 <select id="kickoffDate"></select></label>
    <label>联赛/杯赛 <select id="competition"><option value="全部">全部赛事</option></select></label>
    <label>等级 <select id="grade"><option value="全部">全部等级</option><option>A</option><option>B</option><option>C</option><option>N</option></select></label>
  </section>
  <div class="summary" id="summary"></div>
  <div class="table-wrap"><table>
    <thead><tr><th>北京时间</th><th>联赛/杯赛</th><th>比赛</th><th>状态</th><th>赛果/结算</th><th>等级</th><th>候选球队/意图</th><th>让球方 / 受让方</th><th>候选盘口</th><th>候选水位</th><th>EV均值</th><th>EV P10</th><th>P(EV&gt;0)</th><th>报价/开赛</th><th>版本</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</div>
<script>
let listDates={},activeListDate='',payload=null;
const statusMap={EVALUATED:'已计算',FROZEN_PREMATCH_DECISION:'已冻结赛前决策',NEUTRAL:'中性/无方向',MISSING_DATA:'数据缺失',INSUFFICIENT_TRAINING:'训练样本不足',NOT_PREMATCH:'非赛前/已开赛',ERROR:'运行错误'};
const settledResults=['W','HW','P','HL','L'];
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=x=>x==null?'':(typeof x==='number'?x.toFixed(4):esc(x));
const beijingDate=x=>{const m=String(x||'').replace(/\//g,'-').match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);return m?`${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`:''};
const beijingToday=()=>{const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const y=p.find(x=>x.type==='year').value,m=p.find(x=>x.type==='month').value,d=p.find(x=>x.type==='day').value;return `${y}-${m}-${d}`};
const settlementText=x=>{const s=x.settlement||{},score=x.score||s.score||'',result=x.result||s.result||'';if(score&&result)return `${esc(score)} / ${esc(result)}`;if(score)return esc(score);if(x.settlement_status)return x.settlement_status==='SETTLED'?'已结算':'待核';return '—'};
const statusText=x=>x.settlement_status==='SETTLED'||settledResults.includes(x.result)?'已结算':(statusMap[x.analysis_status]||x.analysis_status||'—');

async function load(){
  const listed=await fetch('./data/index.json?ts='+Date.now()).then(r=>r.json());
  listDates=Object.fromEntries(listed.map(x=>[x,'./data/'+x+'.json']));
  try{const pointer=await fetch('../data/current.json?ts='+Date.now()).then(r=>r.json());activeListDate=String(pointer.display_list_date||pointer.list_date||'')}catch(e){activeListDate=''}
  const d=document.getElementById('date');const ordered=Object.keys(listDates).sort().reverse();ordered.forEach(x=>d.add(new Option(x,x)));
  const requested=new URLSearchParams(location.search).get('date');d.value=requested&&listDates[requested]?requested:(activeListDate&&listDates[activeListDate]?activeListDate:(ordered[0]||''));
  await refresh();
}
function renderKickoffDates(){
  const select=document.getElementById('kickoffDate');const days=[...new Set((payload?.matches||[]).map(x=>beijingDate(x.kickoff)).filter(Boolean))].sort().reverse();
  const today=beijingToday();select.innerHTML='<option value="">全部开赛日</option>'+days.map(x=>`<option value="${x}">${x}</option>`).join('');
  select.value=days.includes(today)?today:'';
}
async function refresh(){
  const key=document.getElementById('date').value;if(!listDates[key])return;
  payload=await fetch(listDates[key]+'?ts='+Date.now()).then(r=>r.json());
  const c=document.getElementById('competition'),old=c.value;while(c.options.length>1)c.remove(1);
  [...new Set(payload.matches.map(x=>x.competition||x.market?.competition||'未标注'))].sort().forEach(x=>c.add(new Option(x,x)));c.value=[...c.options].some(x=>x.value===old)?old:'全部';
  renderKickoffDates();render();
}
function render(){
  if(!payload)return;const s=payload.summary||{},kd=document.getElementById('kickoffDate').value,comp=document.getElementById('competition').value,g=document.getElementById('grade').value;
  const shown=payload.matches.filter(x=>(!kd||beijingDate(x.kickoff)===kd)&&(comp==='全部'||(x.competition||x.market?.competition||'未标注')===comp)&&(g==='全部'||x.grade===g));
  const q=payload.matches.map(x=>x.last_confirmed_at||x.market?.last_confirmed_at).filter(Boolean).sort().pop()||'—';
  document.getElementById('summary').innerHTML=`列表日 ${esc(payload.list_date)}｜开赛日 ${kd||'全部'}｜显示 ${shown.length} 场｜总赛事 ${s.total}｜真实计算 ${s.computed}｜A ${s.A}｜B ${s.B}｜C ${s.C}｜N ${s.N}｜中性 ${s.neutral}｜缺失 ${s.missing_data}｜非赛前 ${s.not_prematch}<br><span class="meta">当前run：${esc(payload.run_id||'—')}｜最近报价确认：${esc(q)}</span>`;
  document.getElementById('rows').innerHTML=shown.map(x=>{const m=x.market||{},home=m.home_team||'',away=m.away_team||'',team=x.candidate_team||x.selected_team||'—',side=x.candidate_side||x.selected_side||'—',hours=x.hours_from_last_refresh_to_kickoff;return `<tr><td>${esc(String(x.kickoff||'').replace('T',' '))} 北京时间</td><td>${esc(x.competition||m.competition||'未标注')}</td><td>${esc(home)} vs ${esc(away)}</td><td class="status">${esc(statusText(x))}</td><td>${settlementText(x)}</td><td class="grade grade-${esc(x.grade||'')}">${esc(x.grade||'—')}</td><td>${esc(team)} [${esc(side)}]<br><small>${esc(x.normalized_intent||x.intent||'—')} ${x.is_latest_valid_prematch?'｜LATEST_VALID_PREMATCH':''}</small></td><td>${esc(m.giving_team||'—')} / ${esc(m.receiving_team||'—')}</td><td>${esc(x.selected_handicap_signed??'—')}</td><td>${esc(x.selected_water_hk??'—')}</td><td>${fmt(x.ev_mean)}</td><td>${fmt(x.ev_p10)}</td><td>${x.p_ev_positive==null?'':(x.p_ev_positive*100).toFixed(2)+'%'}</td><td>${esc(x.quote_at||m.quote_at||'—')}<br><small>距开赛 ${hours==null?'—':esc(hours+'h')}</small></td><td>${esc(x.model_id||'—')}<br><small>${esc(x.side_mapping_version||'—')}</small></td></tr>`}).join('')||'<tr><td colspan="15" class="empty">没有符合筛选条件的赛事</td></tr>';
}
document.getElementById('date').onchange=refresh;document.getElementById('kickoffDate').onchange=render;document.getElementById('competition').onchange=render;document.getElementById('grade').onchange=render;load();
</script>
</body>
</html>
