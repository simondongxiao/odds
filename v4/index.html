<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>足球赛事 V4 数据看板</title>
  <style>
    :root{--ink:#17253d;--muted:#65748b;--line:#dce4ee;--panel:#fff;--blue:#135ca8;--green:#0b7d59;--red:#b42318;--amber:#9a6700;--bg:#f3f6fa}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,"Microsoft YaHei",sans-serif}header{background:#123b64;color:#fff;padding:22px max(22px,calc((100vw - 1540px)/2));display:flex;gap:20px;align-items:end;justify-content:space-between}h1{font-size:25px;margin:0 0 4px}.sub{opacity:.78}.stamp{text-align:right;font-variant-numeric:tabular-nums}main{max-width:1584px;margin:auto;padding:18px 22px 40px}.warning{display:none;border:1px solid #f4b3ad;background:#fff0ee;color:#7a271a;border-radius:10px;padding:12px 15px;margin-bottom:14px;font-weight:650}.toolbar,.cards,.history{display:grid;gap:12px}.toolbar{grid-template-columns:auto auto minmax(220px,1fr) 240px auto;background:var(--panel);padding:12px;border:1px solid var(--line);border-radius:12px;align-items:center}button,select,input{font:inherit;border:1px solid #b9c7d8;border-radius:8px;background:#fff;padding:9px 11px;color:var(--ink)}button{cursor:pointer;font-weight:700}button.active{background:var(--blue);border-color:var(--blue);color:#fff}.view-note{color:var(--muted);white-space:nowrap}.cards{grid-template-columns:repeat(5,minmax(130px,1fr));margin:12px 0}.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px}.card b{display:block;font-size:24px;margin-top:4px;font-variant-numeric:tabular-nums}.card span{color:var(--muted)}.history{grid-template-columns:1.25fr .75fr;background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:12px}.history h2{font-size:16px;margin:0 0 8px}.history-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric{background:#f7f9fc;border-radius:8px;padding:9px}.metric small{display:block;color:var(--muted)}.metric strong{font-size:18px}.explain{color:var(--muted);border-left:3px solid #8bb5df;padding-left:12px}.table-wrap{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:auto;max-height:68vh}table{border-collapse:separate;border-spacing:0;width:100%;min-width:1450px}th,td{padding:8px 9px;border-bottom:1px solid #e7ecf2;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#205d91;color:#fff;z-index:1}tbody tr:nth-child(even){background:#f5fbff}tbody tr:hover{background:#e6f3ff}.result-red{color:var(--red);font-weight:800}.result-black{color:#111;font-weight:800}.result-push{color:var(--amber);font-weight:800}.ok{color:var(--green);font-weight:750}.bad{color:var(--red);font-weight:750}.footer{display:flex;justify-content:space-between;color:var(--muted);padding:10px 3px}.empty{padding:45px;text-align:center;color:var(--muted)}@media(max-width:900px){.toolbar{grid-template-columns:1fr 1fr}.cards{grid-template-columns:repeat(2,1fr)}.history{grid-template-columns:1fr}.stamp{display:none}}
  </style>
</head>
<body>
<header><div><h1>足球赛事数据看板</h1><div class="sub">Excel 全量底稿与 V4 策略视图分离 · V4 仅为 Shadow</div></div><div class="stamp" id="stamp">正在读取数据…</div></header>
<main>
  <div class="warning" id="warning"></div>
  <section class="toolbar">
    <button id="fullBtn" class="active">全部赛事底稿</button><button id="filteredBtn">V4 策略过滤看板</button>
    <input id="search" type="search" placeholder="搜索赛事、球队或 match_id"><select id="competition"><option value="">全部赛事</option></select><span class="view-note" id="viewNote"></span>
  </section>
  <section class="cards">
    <div class="card"><span>当前视图行数</span><b id="shown">—</b></div><div class="card"><span>Excel 底稿总行数</span><b id="ledgerTotal">—</b></div><div class="card"><span>已结算统计样本</span><b id="settled">—</b></div><div class="card"><span>有效胜率</span><b id="winRate">—</b></div><div class="card"><span>累计盈亏</span><b id="pnl">—</b></div>
  </section>
  <section class="history"><div><h2 id="historyTitle">同赛事历史统计</h2><div class="history-grid"><div class="metric"><small>底稿记录</small><strong id="hTotal">—</strong></div><div class="metric"><small>已结算样本</small><strong id="hSettled">—</strong></div><div class="metric"><small>有效胜率</small><strong id="hRate">—</strong></div><div class="metric"><small>累计盈亏</small><strong id="hPnl">—</strong></div></div></div><div class="explain">“底稿记录”用于完整性核对；胜率、ROI 和盈亏只使用已结算且红黑标签有效的样本。两者分母分开显示，因此意丙会呈现“43 条底稿 / 16 条已结算样本”，不会再把 16 误报成总场数。</div></section>
  <div class="table-wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div><div class="footer"><span id="pageInfo"></span><span>前端读取静态 JSON；Excel 仅在更新任务中写入</span></div>
</main>
<script>
const paths={full:'./data/data_full.json',filtered:'./data/data_filtered.json',history:'./data/v4_competition_history.json'};
const columns=[['日期筛选','日期'],['比赛时间','开赛时间'],['赛事分布','赛事分布'],['联赛/杯赛','赛事'],['具体比赛','具体比赛'],['Match_ID','match_id'],['即时主水','主水'],['即时盘口','盘口'],['即时客水','客水'],['V4等级/信号','V4信号'],['投注方','投注方'],['模型有效胜率','模型胜率'],['Final_Decision','最终决策'],['Quality_Gate_Passed','质量门禁'],['赛果','赛果'],['结算状态','状态'],['红黑','红黑'],['盈亏(u)','盈亏(u)']];
const state={payload:{},history:{},view:'full',query:'',competition:''};const el=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fmtRate(v){return v==null?'—':(v*100).toFixed(1)+'%'}function fmtPnl(v){return v==null?'—':`${v>=0?'+':''}${Number(v).toFixed(2)}u`}
function populateCompetitions(){const names=Object.keys(state.history.competitions||state.payload.full.competition_stats||{});el('competition').innerHTML='<option value="">全部赛事</option>'+names.map(x=>`<option>${esc(x)}</option>`).join('')}
function render(){const p=state.payload[state.view];let rows=p.rows||[];if(state.competition)rows=rows.filter(r=>(r['联赛/杯赛']||'未分类')===state.competition);if(state.query){const q=state.query.toLowerCase();rows=rows.filter(r=>columns.some(([k])=>String(r[k]??'').toLowerCase().includes(q)))}const base=state.payload.full.summary||{},display=p.summary||{};el('shown').textContent=rows.length.toLocaleString();el('ledgerTotal').textContent=(base.total_ledger_rows??base.ledger_n??'—').toLocaleString?.()??'—';el('settled').textContent=(display.settled_sample_rows??display.historical_n??0).toLocaleString();const rate=display.effective_win_rate??display.rate;const pnl=display.pnl_u??display.pnl;el('winRate').textContent=fmtRate(rate);el('pnl').textContent=fmtPnl(pnl);el('pnl').className=Number(pnl)<0?'bad':'ok';const hs=state.competition?(state.history.competitions||{})[state.competition]:(state.history.summary||base);const hall=hs?.all||hs||{};el('historyTitle').textContent=state.competition?`${state.competition} · 历史盈亏统计`:'全部赛事 · 历史盈亏统计';el('hTotal').textContent=hs?.ledger_n??hs?.total_ledger_rows??'—';el('hSettled').textContent=hs?.historical_n??hs?.settled_sample_rows??hall.n??'—';el('hRate').textContent=fmtRate(hall.effective_win_rate);el('hPnl').textContent=fmtPnl(hall.pnl??hall.pnl_u);el('viewNote').textContent=p.label||'';el('head').innerHTML=columns.map(([,label])=>`<th>${esc(label)}</th>`).join('');const limit=500,shown=rows.slice(0,limit);el('body').innerHTML=shown.length?shown.map(r=>'<tr>'+columns.map(([k])=>{const v=r[k];const cls=k==='红黑'?(v==='红'||v==='半红'?'result-red':v==='黑'||v==='半黑'?'result-black':'result-push'):k==='Quality_Gate_Passed'?(v===true?'ok':'bad'):'';return`<td class="${cls}">${esc(v===true?'通过':v===false?'未通过':v)}</td>`}).join('')+'</tr>').join(''):`<tr><td class="empty" colspan="${columns.length}">当前条件没有记录</td></tr>`;el('pageInfo').textContent=rows.length>limit?`共 ${rows.length} 行，为保证速度当前显示前 ${limit} 行`:`共 ${rows.length} 行`}
function setView(view){state.view=view;el('fullBtn').classList.toggle('active',view==='full');el('filteredBtn').classList.toggle('active',view==='filtered');render()}async function load(){try{const [full,filtered,history]=await Promise.all([fetch(paths.full,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}),fetch(paths.filtered,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}),fetch(paths.history,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()})]);state.payload={full,filtered};state.history=history;populateCompetitions();el('stamp').innerHTML=`数据日 ${esc(full.list_date)}<br>${esc(full.generated_at)}<br>历史源 ${esc(history.metadata?.source_excel_sha256||'')}`;el('fullBtn').textContent=full.label;el('filteredBtn').textContent=filtered.label;const audit=full.count_shrink_audit||{};const reconcile=full.reconciliation||{};if(audit.status==='ROW_COUNT_SHRINK_WARNING'||reconcile.status==='FAIL'){el('warning').style.display='block';el('warning').textContent=audit.status==='ROW_COUNT_SHRINK_WARNING'?'ROW_COUNT_SHRINK_WARNING：'+(audit.message||'赛事总数异常缩减，底稿覆盖已被拦截。'):'三方对账失败：'+((reconcile.mismatches||[]).join('、')||'请检查 Excel、JSON 与页面数据。')}render()}catch(e){el('warning').style.display='block';el('warning').textContent='数据文件读取失败：'+e.message+'。请通过 HTTP 服务打开本页，并确认三份 JSON 已生成。'}}el('fullBtn').onclick=()=>setView('full');el('filteredBtn').onclick=()=>setView('filtered');el('search').oninput=e=>{state.query=e.target.value.trim();render()};el('competition').onchange=e=>{state.competition=e.target.value;render()};load();
</script>
</body></html>
