<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V4模型 Shadow 看板</title><style>body{font:14px Arial,"Microsoft YaHei",sans-serif;margin:0;background:#f4f7fb;color:#17324d}.wrap{max-width:1500px;margin:0 auto;padding:18px}.hero{background:#1767a5;color:#fff;padding:16px 20px}.hero h1{margin:0 0 8px;font-size:25px}.definitions{background:#fff;border:1px solid #c8d9e8;padding:12px 16px;line-height:1.8}.controls{display:flex;gap:10px;flex-wrap:wrap;background:#eaf2f9;padding:12px;border:1px solid #c8d9e8}.controls label{font-weight:700}.controls select{min-width:150px;padding:7px;border:1px solid #8bb3d3;background:#fff}.summary{margin:10px 0;padding:10px;background:#fff;border-left:5px solid #1767a5}.table-wrap{overflow:auto;background:#fff;border:1px solid #c8d9e8}table{border-collapse:collapse;width:100%;min-width:1200px}th{background:#dcecf8;text-align:left}td,th{padding:8px;border:1px solid #d4e0ea;white-space:nowrap}.grade{font-weight:700}.grade-B{color:#b45309}.grade-C{color:#2563eb}.grade-N{color:#b91c1c}.status{color:#526b7d}.empty{padding:24px;text-align:center;color:#65798a}.note{color:#b91c1c;font-weight:700}</style></head><body><div class="wrap"><section class="hero"><h1>V4模型入选（纸面验证）</h1><div>V4 Shadow Only｜不构成真实下注建议｜real_money=false</div></section><section class="definitions"><b>等级定义：</b> A：EV均值&gt;0、EV P10&gt;0且P(EV&gt;0)≥95%；B：EV均值&gt;0且P(EV&gt;0)≥85%，但未达到A；C：EV均值&gt;0但未达到A/B；N：已完成真实概率计算但EV均值≤0。<br><b>其他状态：</b> Neutral=盘口存在但没有可验证方向假设；数据缺失/非赛前不计入computed。P(EV&gt;0)不是比赛胜率。</section><section class="controls"><label>日期 <select id="date"></select></label><label>联赛/杯赛 <select id="competition"><option value="全部">全部赛事</option></select></label><label>等级 <select id="grade"><option value="全部">全部等级</option><option>A</option><option>B</option><option>C</option><option>N</option></select></label></section><div class="summary" id="summary"></div><div class="table-wrap"><table><thead><tr><th>北京时间</th><th>联赛/杯赛</th><th>比赛</th><th>状态</th><th>等级</th><th>球队</th><th>盘口</th><th>水位</th><th>EV均值</th><th>EV P10</th><th>P(EV&gt;0)</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>
const dates={'2026-09-14':'./data/2026-09-14.json','2026-09-13':'./data/2026-09-13.json'};const statusMap={EVALUATED:'已计算',NEUTRAL:'中性/无方向',MISSING_DATA:'数据缺失',INSUFFICIENT_TRAINING:'训练样本不足',NOT_PREMATCH:'非赛前/已开赛',ERROR:'运行错误'};let payload=null;
const fmtTime=x=>{if(!x)return '';return x.replace('T',' ').replace(/\+08:00$/,'')+' 北京时间'};const fmt=x=>x==null?'':(typeof x==='number'?x.toFixed(4):x);
async function load(){const d=document.getElementById('date');Object.keys(dates).forEach(x=>d.add(new Option(x,x)));d.value=Object.keys(dates)[0];await refresh()}
async function refresh(){payload=await fetch(dates[document.getElementById('date').value]+'?v=20260914-080913').then(r=>r.json());const c=document.getElementById('competition');const old=c.value;while(c.options.length>1)c.remove(1);[...new Set(payload.matches.map(x=>x.competition||x.market?.competition||'未标注'))].sort().forEach(x=>c.add(new Option(x,x)));c.value=[...c.options].some(x=>x.value===old)?old:'全部';render()}
function render(){const s=payload.summary;document.getElementById('summary').textContent=`列表日 ${payload.list_date}｜总赛事 ${s.total}｜真实计算 ${s.computed}｜A ${s.A}｜B ${s.B}｜C ${s.C}｜N ${s.N}｜中性 ${s.neutral}｜缺失 ${s.missing_data}｜非赛前 ${s.not_prematch}`;const comp=document.getElementById('competition').value,g=document.getElementById('grade').value;const rows=payload.matches.filter(x=>(comp==='全部'||(x.competition||x.market?.competition||'未标注')===comp)&&(g==='全部'||x.grade===g));document.getElementById('rows').innerHTML=rows.map(x=>{const home=x.market?.home_team||'',away=x.market?.away_team||'';return `<tr><td>${fmtTime(x.kickoff)}</td><td>${x.competition||x.market?.competition||'未标注'}</td><td>${home} vs ${away}</td><td class="status">${statusMap[x.analysis_status]||x.analysis_status}</td><td class="grade grade-${x.grade||''}">${x.grade||'—'}</td><td>${x.selected_team||'—'}</td><td>${x.selected_handicap_signed??'—'}</td><td>${x.selected_water_hk??'—'}</td><td>${fmt(x.ev_mean)}</td><td>${fmt(x.ev_p10)}</td><td>${x.p_ev_positive==null?'':(x.p_ev_positive*100).toFixed(2)+'%'}</td></tr>`}).join('')||'<tr><td colspan="11" class="empty">没有符合筛选条件的赛事</td></tr>'}
document.getElementById('date').onchange=refresh;document.getElementById('competition').onchange=render;document.getElementById('grade').onchange=render;load();</script></body></html>
