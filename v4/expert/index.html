<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V4 Expert Selector</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7fb;color:#17324d;font:14px Arial,"Microsoft YaHei",sans-serif}main{max-width:1650px;margin:auto;padding:16px}header{background:#1767a5;color:#fff;padding:18px 22px}header h1{margin:0 0 7px}header a{color:#fff}.note,.controls,.cards{background:#fff;border:1px solid #c6d9e8;padding:12px;margin-top:10px}.controls{display:flex;gap:12px;flex-wrap:wrap}.controls select{padding:8px;border:1px solid #8eb5d3}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.card{border:1px solid #c6d9e8;padding:10px}.card b{display:block;font-size:22px;color:#1767a5}.table{overflow:auto;margin-top:10px;background:#fff}table{border-collapse:collapse;width:100%;min-width:1500px}th{background:#dcecf8}td,th{border:1px solid #d4e0ea;padding:8px;vertical-align:top;white-space:nowrap}small{display:block;color:#60778b;margin-top:3px}.sel{color:#07843f;font-weight:700}.rej{color:#b42318;font-weight:700}.na{color:#7a607d;font-weight:700}
</style></head><body><main><header><h1>V4 Expert Selector</h1><div>职责仅限：评估比赛级 Edge 的可靠性；不决定底层方向，不改变固定 1U。</div><p><a href="../">返回 V4</a></p></header><div class="note">具备比赛身份、亚洲盘口、双边水位与欧赔即可进入 <b>CORE</b>。E2/E3、首发、伤停或盘口路径缺失只降低到 CORE/MARKET，不会把正常候选无故判为 UNAVAILABLE。</div><div class="controls"><label>列表日 <select id="date"></select></label><label>层级 <select id="tier"><option value="全部">全部</option><option>CORE</option><option>MARKET</option><option>FULL</option><option>UNAVAILABLE</option></select></label><label>专家结论 <select id="action"><option value="全部">全部</option><option>SELECTED_SHADOW</option><option>REJECTED_SHADOW</option><option>UNAVAILABLE</option></select></label></div><div id="cards" class="cards"></div><div class="table"><table><thead><tr><th>时间</th><th>赛事</th><th>比赛</th><th>核心方向</th><th>双边EV</th><th>质量/不确定性</th><th>Expert 层级</th><th>Expert 结论</th><th>缺失但可选字段</th><th>固定仓位</th><th>模型</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script>let p=null,dates={};const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])),num=x=>x==null||x===''?'—':Number(x).toFixed(4),pct=x=>x==null||x===''?'—':(Number(x)*100).toFixed(1)+'%';async function start(){const a=await fetch('../data/index.json?'+Date.now()).then(r=>r.json());a.sort().reverse().forEach(d=>{$('date').add(new Option(d,d));dates[d]='../data/'+d+'.json'});await load()}async function load(){p=await fetch(dates[$('date').value]+'?'+Date.now()).then(r=>r.json());render()}function render(){const tier=$('tier').value,action=$('action').value,rows=p.matches.filter(x=>{const e=x.expert_selector||{},t=e.tier||(x.analysis_status==='EVALUATED'?'UNAVAILABLE':'UNAVAILABLE'),a=e.decision||'UNAVAILABLE';return(tier==='全部'||t===tier)&&(action==='全部'||a===action)}),evals=p.matches.filter(x=>x.analysis_status==='EVALUATED'),core=evals.filter(x=>(x.expert_selector||{}).core_evaluable).length,selected=evals.filter(x=>(x.expert_selector||{}).decision==='SELECTED_SHADOW').length;$('cards').innerHTML=[['总赛事',p.matches.length],['已评估',evals.length],['CORE可评估',core],['CORE可评估率',evals.length?pct(core/evals.length):'—'],['入选Shadow',selected],['固定仓位','1U']].map(x=>`<div class=card>${x[0]}<b>${x[1]}</b></div>`).join('');$('rows').innerHTML=rows.map(x=>{const m=x.market||{},e=x.expert_selector||{},a=e.decision||'UNAVAILABLE',c=a==='SELECTED_SHADOW'?'sel':a==='REJECTED_SHADOW'?'rej':'na';return`<tr><td>${esc(String(x.kickoff_at||x.kickoff||'').replace('T',' '))}</td><td>${esc(x.competition||'—')}<small>${esc(x.domain||'旧版未采集')} / ${esc(x.league_level||'旧版未采集')}</small></td><td>${esc(m.home_team||'—')} vs ${esc(m.away_team||'—')}</td><td>${esc(x.final_decision||'UNAVAILABLE')}<small>${esc(x.selected_team||'—')} ${esc(x.selected_side||'')}</small></td><td>${num(x.ev_giving??x.diagnostic_giving?.EV_mean)} / ${num(x.ev_receiving??x.diagnostic_receiving?.EV_mean)}</td><td>${esc(x.data_quality||'旧版未采集')} / ${esc(x.market_quality||'旧版未采集')}<small>不确定性 ${pct(x.uncertainty)}</small></td><td>${esc(e.tier||'UNAVAILABLE')}<small>CORE ${e.core_evaluable===true?'可评估':e.core_evaluable===false?'不可评估':'旧版未采集'}</small></td><td class=${c}>${esc(a)}<small>${esc(e.reason||x.decision_reason||'旧版未采集')}</small></td><td>${esc((e.optional_missing||[]).join('、')||'无/旧版未采集')}</td><td>${x.bet_unit===1?'1U':'0U'}<small>ABC不影响仓位</small></td><td>${esc(x.model_id||'—')}<small>${esc(x.direction_rule_version||x.side_mapping_version||'—')}</small></td></tr>`}).join('')||'<tr><td colspan=11>没有符合条件的赛事</td></tr>'}$('date').onchange=load;$('tier').onchange=render;$('action').onchange=render;start();</script></body></html>
