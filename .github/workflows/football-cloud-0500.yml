name: Football cloud update 05:07 Beijing

on:
  schedule:
    # 05:07 Asia/Shanghai = 21:07 UTC on the previous day.
    - cron: "7 21 * * *"
  workflow_dispatch:

concurrency:
  group: football-cloud-0507
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      TITAN_ENABLE_BROWSER_FALLBACK: "1"
      TITAN_BROWSER_BATCH_LIMIT: "48"
      TITAN_ENABLE_MOBILE_FALLBACK: "0"
      TITAN_ENABLE_BETEXPLORER: "1"
      TITAN_ENABLE_BETEXPLORER_SUPPLEMENT: "1"
      BETEXPLORER_TIMEOUT: "8"
      BETEXPLORER_MAX_WORKERS: "12"
      BETEXPLORER_SUPPLEMENT_MAX_WORKERS: "12"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore cloud ledger from gh-pages
        run: |
          git fetch origin gh-pages
          mkdir -p data/github_football
          git show origin/gh-pages:data/github_football/ledger.json > data/github_football/ledger.json 2>/dev/null || true
          git show origin/gh-pages:data/github_football/ledger.csv > data/github_football/ledger.csv 2>/dev/null || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cloud dependencies
        run: |
          python -m pip install -r requirements.txt playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Run portable football skill
        run: python tools/github_football_update.py --list-date "$(TZ=Asia/Shanghai date +%F)"
      - name: Publish lightweight mobile dashboards
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/football-gh-pages
          git worktree add --detach /tmp/football-gh-pages origin/gh-pages
          mkdir -p /tmp/football-gh-pages/v3 /tmp/football-gh-pages/v4
          cp -R github_site/v3/. /tmp/football-gh-pages/v3/
          cp -R github_site/v4/. /tmp/football-gh-pages/v4/
          cp -R data/github_football/. /tmp/football-gh-pages/data/github_football/
          # Preserve every previously published date.  The updater writes the
          # current date locally, but copying that index verbatim would hide
          # older JSON pages (for example 10/14) from the date selector.
          python - <<'PY'
          import json
          from pathlib import Path
          for version in ("v3", "v4"):
              data_dir = Path("/tmp/football-gh-pages") / version / "data"
              data_dir.mkdir(parents=True, exist_ok=True)
              dates = sorted(p.stem for p in data_dir.glob("????-??-??.json"))
              (data_dir / "index.json").write_text(json.dumps(dates, ensure_ascii=False), encoding="utf-8")
              print(f"{version}_date_index={len(dates)} latest={dates[-1] if dates else ''}")
          PY
          git -C /tmp/football-gh-pages config user.name github-actions[bot]
          git -C /tmp/football-gh-pages config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C /tmp/football-gh-pages add v3 v4 data/github_football
          git -C /tmp/football-gh-pages commit -m "Cloud football update $(TZ=Asia/Shanghai date +%F)" || true
          git -C /tmp/football-gh-pages push origin HEAD:gh-pages
