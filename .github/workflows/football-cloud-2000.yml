name: Football cloud next-day update 20:07 Beijing

on:
  schedule:
    # 20:07 Asia/Shanghai = 12:07 UTC.
    - cron: "7 12 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Explicit Beijing business date (optional)"
        required: false
        type: string
      planned_run_bjt:
        description: "Planned slot timestamp in Asia/Shanghai (optional)"
        required: false
        type: string

concurrency:
  # Morning and evening jobs publish to the same gh-pages branch.  A shared
  # non-cancelling lock prevents a slower run from being overwritten mid-push.
  group: football-gh-pages-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FOOTBALL_PAGES_BASE_URL: https://simondongxiao.github.io/odds
      TITAN_ENABLE_BROWSER_FALLBACK: "1"
      TITAN_BROWSER_BATCH_LIMIT: "48"
      TITAN_BROWSER_PRIORITY2_MIN: "16"
      TITAN_BROWSER_CUP_MIN: "4"
      TITAN_ENABLE_MOBILE_FALLBACK: "0"
      TITAN_ENABLE_BETEXPLORER: "1"
      TITAN_ENABLE_BETEXPLORER_SUPPLEMENT: "1"
      BETEXPLORER_TIMEOUT: "8"
      BETEXPLORER_MAX_WORKERS: "12"
      BETEXPLORER_SUPPLEMENT_MAX_WORKERS: "12"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore cloud ledger from gh-pages
        run: |
          git fetch origin gh-pages
          mkdir -p data/github_football
          git show origin/gh-pages:data/github_football/ledger.json > data/github_football/ledger.json 2>/dev/null || true
          python tools/restore_largest_ledger.py --ref origin/gh-pages --repo-path data/github_football/ledger.json --output data/github_football/ledger.json
          git show origin/gh-pages:data/github_football/ledger.csv > data/github_football/ledger.csv 2>/dev/null || true
          git show origin/gh-pages:data/github_football/run_manifest.json > data/github_football/run_manifest.json 2>/dev/null || true
          mkdir -p github_site/v3/data github_site/v4/data
          git show origin/gh-pages:v4/data/v3_history_detail.json > github_site/v3/data/v3_history_detail.json 2>/dev/null || true
          git show origin/gh-pages:v4/data/v4_history_detail.json > github_site/v4/data/v4_history_detail.json 2>/dev/null || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve Beijing next-day target date
        id: target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/resolve_target_date.py --mode evening --event "${{ github.event_name }}" --schedule "${{ github.event.schedule || '' }}" --target-date "${{ inputs.target_date || '' }}" --planned-run-bjt "${{ inputs.planned_run_bjt || '' }}" --output "$GITHUB_OUTPUT"
      - name: Guard duplicate business slot
        id: dedupe
        run: |
          run_key="${{ steps.target.outputs.target_list_date }}|${{ steps.target.outputs.planned_slot }}|${{ github.sha }}"
          prior=$(python -c "import json; p=json.load(open('data/github_football/run_manifest.json', encoding='utf-8')); print(p.get('run_key',''))" 2>/dev/null || true)
          if [ "$prior" = "$run_key" ] && python -c "import json,sys; p=json.load(open('data/github_football/run_manifest.json', encoding='utf-8')); sys.exit(0 if p.get('status') in {'SUCCESS','DIAGNOSTIC','SKIPPED_DUPLICATE'} else 1)"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Duplicate completed business slot: $run_key"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install cloud dependencies
        run: |
          python -m pip install -r requirements.txt playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Run portable next-day skill
        id: update
        run: python tools/github_football_update.py --list-date "${{ steps.target.outputs.list_date }}"
      - name: Publish lightweight mobile dashboards
        id: publish
        if: steps.dedupe.outputs.skip != 'true'
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/football-dashboard-payload"
          rm -rf "$stage"
          mkdir -p "$stage/v3" "$stage/v4" "$stage/data/github_football"
          cp -R github_site/v3/. "$stage/v3/"
          cp -R github_site/v4/. "$stage/v4/"
          cp -R data/github_football/. "$stage/data/github_football/"
          for attempt in 1 2 3; do
            git fetch origin gh-pages
            rm -rf /tmp/football-gh-pages
            git worktree add --detach /tmp/football-gh-pages origin/gh-pages
            cp -R "$stage/v3/." /tmp/football-gh-pages/v3/
            cp -R "$stage/v4/." /tmp/football-gh-pages/v4/
            cp -R "$stage/data/github_football/." /tmp/football-gh-pages/data/github_football/
            # Rebuild only the date index; all older published JSON remains.
            python - <<'PY'
          import json
          from pathlib import Path
          for version in ("v3", "v4"):
              data_dir = Path("/tmp/football-gh-pages") / version / "data"
              data_dir.mkdir(parents=True, exist_ok=True)
              dates = sorted(p.stem for p in data_dir.glob("????-??-??.json"))
              (data_dir / "index.json").write_text(json.dumps(dates, ensure_ascii=False), encoding="utf-8")
              print(f"{version}_date_index={len(dates)} latest={dates[-1] if dates else ''}")
          PY
            git -C /tmp/football-gh-pages config user.name github-actions[bot]
            git -C /tmp/football-gh-pages config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git -C /tmp/football-gh-pages add v3 v4 data/github_football
            if git -C /tmp/football-gh-pages diff --cached --quiet; then
              echo "No gh-pages changes; retaining current published commit"
              echo "pages_sha=$(git -C /tmp/football-gh-pages rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              break
            fi
            git -C /tmp/football-gh-pages commit -m "Cloud football update ${{ steps.target.outputs.list_date }}"
            if git -C /tmp/football-gh-pages push origin HEAD:gh-pages; then
              echo "pages_sha=$(git -C /tmp/football-gh-pages rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "gh-pages push conflicted after 3 attempts" >&2
              exit 1
            fi
            echo "gh-pages moved during publish; refetching and reapplying payload (attempt $attempt)" >&2
            sleep 2
          done
      - name: Verify GitHub Pages online
        id: pages
        if: steps.dedupe.outputs.skip != 'true' && steps.update.outcome == 'success' && steps.publish.outcome == 'success'
        run: |
          expected_v3=$(python -c "import json; print(json.load(open('github_site/v3/data/${{ steps.target.outputs.list_date }}.json', encoding='utf-8'))['generated_at'])")
          expected_v4=$(python -c "import json; print(json.load(open('github_site/v4/data/${{ steps.target.outputs.list_date }}.json', encoding='utf-8'))['generated_at'])")
          python tools/wait_for_pages.py --date "${{ steps.target.outputs.list_date }}" --sha "${{ steps.publish.outputs.pages_sha }}" --expected-v3 "$expected_v3" --expected-v4 "$expected_v4"
      - name: Send Feishu result after publish verification
        if: always()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
          DEDUPE_SKIP: ${{ steps.dedupe.outputs.skip }}
        run: |
          if [ "$DEDUPE_SKIP" = "true" ]; then STATUS=SKIPPED_DUPLICATE; else
          MODEL_STATUS=$(python -c "import json; print(json.load(open('data/github_football/last_run.json', encoding='utf-8')).get('model_status','UNKNOWN'))" 2>/dev/null || echo UNKNOWN)
          if [ "$UPDATE_OUTCOME" = "success" ] && [ "$PUBLISH_OUTCOME" = "success" ] && [ "$PAGES_OUTCOME" = "success" ]; then
            if [ "$MODEL_STATUS" = "FORMAL_VERIFIED" ]; then STATUS=SUCCESS; else STATUS=DIAGNOSTIC; fi
          else
            STATUS=FAILED
          fi
          fi
          python tools/send_feishu_notification.py \
            --date "${{ steps.target.outputs.list_date }}" \
            --status "$STATUS" \
            --workflow "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" \
            --event "${{ github.event_name }}" \
            --scheduled-at "${{ steps.target.outputs.scheduled_at }}" \
            --planned-slot "${{ steps.target.outputs.planned_slot }}" \
            --planned-run-bjt "${{ steps.target.outputs.planned_run_bjt }}" \
            --actual-run-bjt "${{ steps.target.outputs.actual_run_bjt }}" \
            --target-list-date "${{ steps.target.outputs.target_list_date }}" \
            --trigger-source "${{ steps.target.outputs.trigger_source }}" \
            --run-key "${{ steps.target.outputs.target_list_date }}|${{ steps.target.outputs.planned_slot }}|${{ github.sha }}" \
            --actual-started-at "${{ steps.target.outputs.actual_started_at }}" \
            --pages-sha "${{ steps.publish.outputs.pages_sha }}" \
            --pages-status "$PAGES_OUTCOME" \
            --failure-stage "${{ steps.update.outcome != 'success' && 'update' || steps.publish.outcome != 'success' && 'publish' || steps.pages.outcome != 'success' && 'pages' || '' }}" \
            --failure-reason "update=${UPDATE_OUTCOME}; publish=${PUBLISH_OUTCOME}; pages=${PAGES_OUTCOME}" \
            --base-url "$FOOTBALL_PAGES_BASE_URL"
      - name: Upload run manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-run-${{ steps.target.outputs.list_date }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            data/github_football/last_run.json
            data/github_football/run_manifest.json
