name: Basketball daily update and Feishu delivery

on:
  schedule:
    # GitHub may delay or drop jobs scheduled exactly on the hour under load.
    # Use an off-peak minute while keeping the Beijing 05:00/20:00 windows.
    # 05:07 Asia/Shanghai = 21:07 UTC on the previous day.
    - cron: "7 21 * * *"
    # 20:07 Asia/Shanghai = 12:07 UTC; this run targets tomorrow in Beijing time.
    - cron: "7 12 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional Beijing target date (YYYY-MM-DD); blank follows the schedule"
        required: false
        type: string
      notify:
        description: "Send the result to Feishu"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  # Basketball and football both write gh-pages; serialize all publishers.
  group: football-gh-pages-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Shanghai
      BASKETBALL_RUN_ROOT: ${{ github.workspace }}/.basketball-run
      BASKETBALL_PUBLIC_DIR: ${{ github.workspace }}/public
    steps:
      - name: Checkout automation source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout published dashboard state
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore Titan history cache
        id: titan-history-cache
        uses: actions/cache/restore@v4
        with:
          path: .basketball-run/reference_data/titan007_history
          key: basketball-titan-history-v4-${{ runner.os }}-${{ hashFiles('basketball_engine/scripts/providers/titan007_history_adapter.py', 'basketball_engine/scripts/providers/titan007_feature_store.py') }}-${{ github.run_id }}
          restore-keys: |
            basketball-titan-history-v4-${{ runner.os }}-${{ hashFiles('basketball_engine/scripts/providers/titan007_history_adapter.py', 'basketball_engine/scripts/providers/titan007_feature_store.py') }}-
            basketball-titan-history-v4-${{ runner.os }}-

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Resolve Beijing target date
        id: target
        env:
          OVERRIDE_DATE: ${{ inputs.target_date || '' }}
          SCHEDULE_CRON: ${{ github.event.schedule || '' }}
        run: |
          python - <<'PY'
          import os
          from datetime import date, timedelta
          from zoneinfo import ZoneInfo
          from datetime import datetime

          override = os.environ.get("OVERRIDE_DATE", "").strip()
          schedule = os.environ.get("SCHEDULE_CRON", "").strip()
          if override:
              target = date.fromisoformat(override)
              run_kind = "MANUAL_TARGET_DATE"
          else:
              today = datetime.now(ZoneInfo("Asia/Shanghai")).date()
              if schedule == "7 12 * * *":
                  target = today + timedelta(days=1)
                  run_kind = "NEXT_DAY_EVENING"
              elif schedule == "7 21 * * *":
                  target = today
                  run_kind = "TODAY_EARLY_MORNING"
              else:
                  target = today
                  run_kind = "TODAY_MORNING"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"BASKETBALL_DATE={target.isoformat()}\n")
              fh.write(f"BASKETBALL_RUN_KIND={run_kind}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"date={target.isoformat()}\n")
              fh.write(f"kind={run_kind}\n")
          print(f"Beijing target date: {target.isoformat()} ({run_kind})")
          PY

      - name: Record scheduled stage
        run: >-
          python automation/stage_status.py
          --root "$BASKETBALL_RUN_ROOT"
          --stage SCHEDULED
          --status SUCCESS
          --business-date "$BASKETBALL_DATE"
          --detail run_kind="$BASKETBALL_RUN_KIND"
          --detail schedule="${{ github.event.schedule || 'workflow_dispatch' }}"

      - name: Run basketball daily engine
        id: engine
        run: python automation/run_basketball_daily.py

      - name: Publish dashboard to gh-pages
        id: publish
        run: |
          # The dashboard branch may receive a football or manual update while
          # this long-running basketball crawl is in progress. Preserve the
          # generated basketball payload, reset to the newest remote tip, then
          # commit the payload on top so publishing is fast-forward safe.
          stage="$RUNNER_TEMP/basketball-dashboard-publish"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -a public/basketball-v2.html public/basketball.html public/basketball-data public/basketball-sources "$stage/"
          git -C public fetch origin gh-pages
          git -C public reset --hard origin/gh-pages
          cp -a "$stage"/basketball-v2.html "$stage"/basketball.html "$stage"/basketball-data "$stage"/basketball-sources public/
          git -C public config user.name "github-actions[bot]"
          git -C public config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C public add basketball-v2.html basketball.html basketball-data basketball-sources
          if git -C public diff --cached --quiet; then
            echo "No dashboard changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git -C public rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            for attempt in 1 2 3; do
              git -C public commit -m "Automated basketball daily update $(date -u +%F)"
              if git -C public push origin HEAD:gh-pages; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "gh-pages push conflicted after 3 attempts" >&2
                exit 1
              fi
              echo "gh-pages moved during publish; rebasing generated payload (attempt $attempt)"
              git -C public fetch origin gh-pages
              git -C public reset --hard origin/gh-pages
              cp -a "$stage"/basketball-v2.html "$stage"/basketball.html "$stage"/basketball-data "$stage"/basketball-sources public/
              git -C public add basketball-v2.html basketball.html basketball-data basketball-sources
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git -C public rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for GitHub Pages deployment
        if: ${{ always() && steps.publish.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_WORKFLOW_ID: "342557702"
          PAGES_DATA_URL: https://simondongxiao.github.io/odds/basketball-data/latest.json
          PAGES_EXPECTED_GENERATED_AT: ${{ steps.engine.outputs.generated_at }}
          PUBLISH_CHANGED: ${{ steps.publish.outputs.changed }}
        run: >-
          python automation/wait_for_pages.py
          --sha "${{ steps.publish.outputs.sha }}"
          --timeout 600
          --pages-url "$PAGES_DATA_URL"
          --expected-date "$BASKETBALL_DATE"
          --expected-generated-at "$PAGES_EXPECTED_GENERATED_AT"
          --changed "$PUBLISH_CHANGED"
          --audit-root "$BASKETBALL_RUN_ROOT"

      - name: Notify Feishu
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.notify != false) }}
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RUN_STATUS: ${{ job.status }}
          PUBLISHED_SHA: ${{ steps.publish.outputs.sha }}
          DEPLOY_STATUS: ${{ steps.publish.outputs.changed == 'true' && 'success' || 'already-current' }}
          RUN_KIND: ${{ steps.target.outputs.kind }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASKETBALL_DATE: ${{ steps.target.outputs.date }}
        run: >-
          python automation/notify_feishu.py
          --data public/basketball-data/latest.json
          --status "$RUN_STATUS"
          --commit "$PUBLISHED_SHA"
          --deploy-status "$DEPLOY_STATUS"
          --run-kind "$RUN_KIND"
          --run-url "$RUN_URL"
          --audit-root "$BASKETBALL_RUN_ROOT"

      - name: Upload run audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basketball-daily-audit-${{ github.run_id }}
          path: |
            .basketball-run/audits
            .basketball-run/manifests
            .basketball-run/logs
          if-no-files-found: ignore
          retention-days: 14

      - name: Save Titan history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .basketball-run/reference_data/titan007_history
          key: ${{ steps.titan-history-cache.outputs.cache-primary-key }}
