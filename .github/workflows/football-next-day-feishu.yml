name: Football next-day evening update and Feishu delivery

on:
  workflow_dispatch:

concurrency:
  group: football-gh-pages-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-and-notify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FOOTBALL_OUTPUT_ROOT: D:\codex\outputs\football_odds_trader
      FOOTBALL_UPDATE_SCRIPT: D:\codex\技能项目\football_update\run_football_update.py
      FOOTBALL_PYTHON: D:\python\python.exe
      FOOTBALL_DASHBOARD_URL: https://simondongxiao.github.io/odds/v4/
      TITAN_ENABLE_BROWSER_FALLBACK: "0"
      TITAN_ENABLE_MOBILE_FALLBACK: "1"
      TITAN_MOBILE_BROWSER_MARKETS: "ah"
      TITAN_MOBILE_BROWSER_BATCH_LIMIT: "160"
      TITAN_MOBILE_BROWSER_TIMEOUT_MS: "12000"
      TITAN_MOBILE_BROWSER_ATTEMPTS: "2"
      TITAN_MOBILE_BROWSER_REQUEST_INTERVAL: "0.25"

    steps:
      - name: Preflight production runner
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = "Stop"
          $required = @{
            "FOOTBALL_OUTPUT_ROOT" = $env:FOOTBALL_OUTPUT_ROOT
            "FOOTBALL_UPDATE_SCRIPT" = $env:FOOTBALL_UPDATE_SCRIPT
            "FOOTBALL_PUBLISH_REPO" = (Join-Path $env:FOOTBALL_OUTPUT_ROOT "github_publish\odds")
          }
          foreach ($item in $required.GetEnumerator()) {
            if (-not (Test-Path -LiteralPath $item.Value)) {
              throw "Missing production path $($item.Key): $($item.Value). Register the Windows runner with the D:\\codex data tree mounted."
            }
          }
          if (-not $env:FEISHU_WEBHOOK_URL) {
            throw "FEISHU_WEBHOOK_URL GitHub Actions secret is missing."
          }
          Write-Host "Production runner preflight passed."

      - name: Run next-day V3/V4 update
        id: football_update
        shell: powershell -ExecutionPolicy Bypass -File {0}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          $python = $env:FOOTBALL_PYTHON
          if (-not (Test-Path -LiteralPath $python)) {
            $python = (Get-Command python).Source
          }
          $listDate = & $python -c "from datetime import datetime, timezone, timedelta; print((datetime.now(timezone(timedelta(hours=8))).date() + timedelta(days=1)).isoformat())"
          $env:FOOTBALL_LIST_DATE = $listDate.Trim()
          $token = "${{ github.token }}"
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$token"))
          $env:GIT_CONFIG_COUNT = "1"
          $env:GIT_CONFIG_KEY_0 = "http.https://github.com/.extraheader"
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $basic"
          $env:GIT_TERMINAL_PROMPT = "0"
          $publishRepo = Join-Path $env:FOOTBALL_OUTPUT_ROOT "github_publish\odds"
          git config --global --add safe.directory $publishRepo
          git -C $publishRepo fetch origin main gh-pages --quiet
          git -C $publishRepo checkout -B gh-pages origin/gh-pages
          & $python $env:FOOTBALL_UPDATE_SCRIPT --list-date $env:FOOTBALL_LIST_DATE
          if ($LASTEXITCODE -ne 0) {
            throw "next-day football update failed with exit code $LASTEXITCODE"
          }

      - name: Send Feishu result
        if: always()
        shell: powershell -ExecutionPolicy Bypass -File {0}
        env:
          UPDATE_OUTCOME: ${{ steps.football_update.outcome }}
        run: |
          $ErrorActionPreference = "Stop"
          $python = $env:FOOTBALL_PYTHON
          if (-not (Test-Path -LiteralPath $python)) {
            $python = (Get-Command python).Source
          }
          $listDate = & $python -c "from datetime import datetime, timezone, timedelta; print((datetime.now(timezone(timedelta(hours=8))).date() + timedelta(days=1)).isoformat())"
          $feishuScript = Join-Path (Split-Path $env:FOOTBALL_UPDATE_SCRIPT -Parent) "tools\send_feishu_daily_report.py"
          & $python $feishuScript --list-date $listDate.Trim() --status $env:UPDATE_OUTCOME
