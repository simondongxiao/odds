<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V4 Match-Specific</title>
<style>body{font:14px Arial;color:#17324d;background:#f5f8fb;margin:0}main{max-width:1600px;margin:20px auto;padding:0 16px}h1{margin-bottom:4px}.meta,.note{color:#5d7388}.cards{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.card{background:#fff;border:1px solid #d6e2ed;border-radius:8px;padding:10px 14px;min-width:120px}.num{font-size:22px;font-weight:700}.warn{color:#a34700}table{border-collapse:collapse;background:#fff;width:100%;font-size:12px}th,td{border:1px solid #d9e3ec;padding:7px;vertical-align:top}th{background:#e8f2fa;position:sticky;top:0}.bet{color:#087b4b;font-weight:700}.no{color:#b21d1d;font-weight:700}.small{font-size:11px;color:#60788f}</style>
<main><h1>V4 Match-Specific R2</h1><div class="meta">比赛级方向挑战版｜旧 V4_LEGACY_CONTROL 保留不变｜所有 BET 固定 1U</div><div id="meta" class="note"></div><div class="cards" id="cards"></div><div class="note">盘口桶只作为 prior；最终方向来自净胜球分布、两侧独立 EV 和 Expert Selector。当前概率状态：UNCALIBRATED_SHADOW。</div><p><label>列表日 <select id="date"></select></label> <label>Domain <select id="domain"><option>全部</option></select></label> <label>决策 <select id="decision"><option>全部</option><option>BET_GIVING</option><option>BET_RECEIVING</option><option>NO_BET</option><option>UNAVAILABLE</option></select></label></p><table><thead><tr><th>时间</th><th>赛事/Domain</th><th>比赛</th><th>盘口</th><th>旧方向</th><th>新方向</th><th>P给球胜/走</th><th>P受球胜/走</th><th>EV给球</th><th>EV受球</th><th>等级</th><th>Expert Selector</th></tr></thead><tbody id="rows"></tbody></table></main>
<script>
const $=x=>document.getElementById(x), today=new URLSearchParams(location.search).get('date')||new Date().toISOString().slice(0,10);let payload={};
function pct(x){return x==null?'—':(x*100).toFixed(2)+'%'} function load(d){fetch('./data/'+d+'.json?v='+Date.now()).then(r=>r.json()).then(x=>{payload=x;const s=x.summary||{};$('meta').textContent=`列表日 ${x.list_date}｜模型 ${x.model_id}｜训练截止：固定时间外样本｜Forward：${x.forward_status}｜real_money=${x.real_money}`;$('cards').innerHTML=[['总赛事',s.total],['计算',s.computed],['给球BET',s.giving],['受球BET',s.receiving],['NO BET',s.no_bet],['不可用',s.unavailable],['CORE可评估率',pct(s.core_evaluable_rate)]].map(a=>`<div class=card><div>${a[0]}</div><div class=num>${a[1]}</div></div>`).join('');const ds=[...new Set(x.matches.map(r=>r.domain).filter(Boolean))];$('domain').innerHTML='<option>全部</option>'+ds.map(d=>`<option>${d}</option>`).join('');render()})}
function render(){let d=$('domain').value,c=$('decision').value;let a=(payload.matches||[]).filter(r=>(d==='全部'||r.domain===d)&&(c==='全部'||r.final_decision===c));$('rows').innerHTML=a.map(r=>`<tr><td>${r.kickoff_at||'—'}</td><td>${r.competition||'—'}<br><span class=small>${r.domain||'—'}</span></td><td>${r.home_team} vs ${r.away_team}</td><td>${r.selected_handicap??'—'}<br>${r.selected_water??'—'} / ${r.opposite_water??'—'}</td><td>旧 V4：仅作特征</td><td class=${r.final_decision?.startsWith('BET')?'bet':r.final_decision==='NO_BET'?'no':''}>${r.final_decision}<br><span class=small>${(r.reason_codes||[]).join(' · ')}</span></td><td>${pct(r.p_giving_cover)} / ${pct(r.p_push)}</td><td>${pct(r.p_receiving_cover)} / ${pct(r.p_push)}</td><td>${r.ev_giving==null?'—':(r.ev_giving*100).toFixed(2)+'%'}</td><td>${r.ev_receiving==null?'—':(r.ev_receiving*100).toFixed(2)+'%'}</td><td>${r.grade||'—'}</td><td>${r.expert_selector||'CORE'}<br><span class=small>固定1U</span></td></tr>`).join('')||'<tr><td colspan=12>没有符合条件的记录</td></tr>'}
$('domain').onchange=render;$('decision').onchange=render;fetch('./data/index.json?v='+Date.now()).then(r=>r.json()).then(ds=>{const dates=Array.isArray(ds)?ds:ds.dates||[today];$('date').innerHTML=dates.map(d=>`<option>${d}</option>`).join('');$('date').value=dates.includes(today)?today:dates[dates.length-1];load($('date').value)});$('date').onchange=e=>load(e.target.value);
</script>
