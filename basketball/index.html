<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>篮球盘口预测操盘台</title>
  <style>
    :root {
      color-scheme: light;
      --page: #eef3f7;
      --ink: #172331;
      --muted: #657385;
      --line: #b7c5d3;
      --soft: #dfe8f0;
      --panel: #ffffff;
      --panel-alt: #f8fbfd;
      --head: #173a5e;
      --head-2: #246c75;
      --accent: #d7652b;
      --green: #157a4d;
      --red: #c64242;
      --amber: #b87400;
      --blue: #185eaa;
    }
    * { box-sizing: border-box; }
    html { width: 100%; max-width: 100vw; overflow-x: hidden; }
    body {
      margin: 0;
      width: 100%;
      max-width: 100vw;
      background: var(--page);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      font-size: 13px;
      overflow-x: hidden;
    }
    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 11px 14px;
      background: linear-gradient(90deg, var(--head), var(--head-2));
      color: #fff;
      border-bottom: 3px solid var(--accent);
      width: 100%;
      max-width: 100vw;
      overflow: hidden;
    }
    .topbar > div { min-width: 0; }
    h1 { margin: 0; font-size: 19px; line-height: 1.2; letter-spacing: 0; }
    .sub { margin-top: 3px; color: #d8edf0; white-space: normal; word-break: break-all; }
    .sub, .stamp { overflow-wrap: anywhere; }
    .stamp { color: #fff6eb; white-space: nowrap; text-align: right; }
    .dock {
      display: grid;
      grid-template-columns: minmax(220px, .68fr) minmax(260px, .8fr) minmax(320px, 1fr);
      gap: 10px;
      padding: 10px 10px 0;
    }
    .panel {
      min-width: 0;
      border: 1px solid var(--line);
      background: var(--panel);
    }
    .panel-title {
      padding: 7px 10px;
      color: #fff;
      background: var(--head);
      font-weight: 800;
      border-bottom: 1px solid #102e4c;
    }
    .panel-body { padding: 9px; overflow-x: auto; }
    .dock { align-items: start; }
    .dock .panel-body {
      max-height: 218px;
      overflow: auto;
    }
    .gate-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }
    .gate {
      border: 1px solid var(--soft);
      background: var(--panel-alt);
      padding: 7px;
      min-height: 42px;
      overflow-wrap: anywhere;
    }
    .gate b { display: block; color: var(--head); margin-bottom: 3px; }
    .ok { color: var(--green); font-weight: 800; }
    .warn { color: var(--amber); font-weight: 800; }
    .bad { color: var(--red); font-weight: 800; }
    .shell {
      display: grid;
      grid-template-columns: 345px minmax(0, 1fr);
      gap: 10px;
      padding: 10px;
      min-height: 660px;
      height: calc(100vh - 188px);
    }
    .left, .right {
      min-height: 0;
      border: 1px solid var(--line);
      background: var(--panel);
    }
    .left {
      display: grid;
      grid-template-rows: auto auto 1fr;
    }
    .date-strip {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 9px;
      background: #f4f8fb;
      border-bottom: 1px solid var(--soft);
    }
    select, input {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 3px;
      padding: 7px 8px;
      font-size: 13px;
      outline: none;
    }
    .mini-stat {
      min-width: 70px;
      text-align: center;
      border: 1px solid var(--line);
      background: #fff;
      padding: 5px 7px;
      color: var(--blue);
      font-weight: 800;
    }
    .searchbox {
      padding: 8px 9px;
      background: #fbfcfd;
      border-bottom: 1px solid var(--soft);
    }
    .match-list { overflow: auto; background: #fff; }
    .match-item {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 7px;
      padding: 9px;
      border: 0;
      border-bottom: 1px solid var(--soft);
      background: #fff;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      font: inherit;
    }
    .match-item:hover { background: #f5fafb; }
    .match-item.active {
      background: #eef7f8;
      box-shadow: inset 4px 0 0 var(--accent);
    }
    .match-main { font-weight: 800; line-height: 1.35; }
    .match-meta { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 56px;
      height: 22px;
      padding: 0 7px;
      border-radius: 3px;
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      white-space: nowrap;
    }
    .tag-main { background: var(--green); }
    .tag-watch { background: var(--amber); }
    .tag-none { background: #708092; }
    .tag-risk { background: var(--red); }
    .bet-summary {
      display: grid;
      grid-template-columns: repeat(5, minmax(74px, 1fr));
      gap: 5px;
      margin-bottom: 8px;
    }
    .bet-chip {
      border: 1px solid var(--soft);
      background: #fff;
      padding: 5px 6px;
      min-height: 38px;
      overflow-wrap: anywhere;
    }
    .bet-chip b { display: block; color: var(--head); }
    .bet-chip span { color: var(--muted); font-size: 12px; }
    .right {
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }
    .match-header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 10px 12px;
      background: #f7fafc;
      border-bottom: 1px solid var(--line);
    }
    .selected-title { font-size: 19px; font-weight: 900; color: #142b44; }
    .selected-meta { margin-top: 4px; color: var(--muted); }
    .score-box {
      min-width: 188px;
      text-align: center;
      border: 1px solid var(--line);
      background: #fff;
      padding: 6px;
    }
    .score {
      font-size: 15px;
      line-height: 1.35;
      font-weight: 900;
      color: var(--accent);
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .content {
      overflow: auto;
      padding: 10px;
      background: #f2f6f8;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background: #fff;
    }
    th, td {
      border: 1px solid var(--soft);
      padding: 7px 8px;
      text-align: left;
      vertical-align: top;
      line-height: 1.45;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    th {
      background: #ecf4f7;
      color: #173a5e;
      font-weight: 900;
    }
    .kv {
      display: grid;
      grid-template-columns: 112px 1fr;
      border-top: 1px solid var(--soft);
    }
    .kv:first-child { border-top: 0; }
    .kv .k {
      padding: 7px 8px;
      background: #f5f8fb;
      color: var(--muted);
      border-right: 1px solid var(--soft);
      font-weight: 700;
    }
    .kv .v { padding: 7px 8px; }
    .callout {
      border-left: 4px solid var(--accent);
      background: #fffaf5;
      padding: 8px 10px;
      line-height: 1.55;
    }
    .ev-badge {
      margin-top: 7px;
      padding: 7px 8px;
      color: var(--red);
      font-weight: 900;
      background: #fff;
      border: 1px solid #f0c4c4;
    }
    .path {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .step {
      border: 1px solid var(--soft);
      background: #fff;
      padding: 8px;
      min-height: 82px;
    }
    .step b { display: block; color: var(--head-2); margin-bottom: 4px; }
    .small { color: var(--muted); font-size: 12px; }
    @media (max-width: 980px) {
      .topbar, .match-header, .dock, .shell, .grid-2, .grid-3 {
        grid-template-columns: 1fr;
        height: auto;
      }
      .topbar, .dock, .shell, .panel, .left, .right { max-width: 100%; min-width: 0; }
      .stamp { text-align: left; }
      .stamp { white-space: normal; }
      .gate-grid { grid-template-columns: 1fr; }
      .bet-summary { grid-template-columns: 1fr 1fr; }
      th, td { padding: 6px; font-size: 12px; }
      .shell { min-height: 0; }
      .left { min-height: 380px; }
      .path { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <header class="topbar">
    <div>
      <h1>篮球盘口预测操盘台</h1>
      <div class="sub">NBA / WNBA / CBA / G League / 国家队 / 初盘-终盘</div>
    </div>
    <div class="stamp" id="stamp"></div>
  </header>

  <section class="dock">
    <div class="panel">
      <div class="panel-title">今日完成门槛</div>
      <div class="panel-body gate-grid" id="gateGrid"></div>
    </div>
    <div class="panel">
      <div class="panel-title">数据源覆盖</div>
      <div class="panel-body">
        <table>
          <tbody id="sourceRows"></tbody>
        </table>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title">可投/不可投筛选</div>
      <div class="panel-body">
        <div class="bet-summary" id="betSummary"></div>
        <table>
          <thead><tr><th>比赛</th><th>状态</th><th>原因</th><th>动作</th></tr></thead>
          <tbody id="alertRows"></tbody>
        </table>
      </div>
    </div>
  </section>

  <main class="shell">
    <aside class="left">
      <div class="date-strip">
        <select id="dateSelect"></select>
        <div class="mini-stat" id="matchCount"></div>
      </div>
      <div class="searchbox">
        <input id="search" placeholder="搜索球队/联赛/标签">
      </div>
      <div class="match-list" id="matchList"></div>
    </aside>

    <section class="right">
      <div class="match-header">
        <div>
          <div class="selected-title" id="selectedTitle"></div>
          <div class="selected-meta" id="selectedMeta"></div>
        </div>
        <div class="score-box">
          <div class="small">状态/比分</div>
          <div class="score" id="selectedStatus"></div>
        </div>
      </div>
      <div class="content">
        <div class="grid-2">
          <div class="panel">
            <div class="panel-title">模拟投注</div>
            <div class="panel-body">
              <div class="callout" id="coldConclusion"></div>
              <div class="ev-badge" id="evBadge"></div>
            </div>
          </div>
          <div class="panel">
            <div class="panel-title">数据完整性</div>
            <div class="panel-body" id="completeness"></div>
          </div>
        </div>

        <div class="panel" style="margin-bottom:10px;">
          <div class="panel-title">初盘-即时-终盘路径</div>
          <div class="panel-body">
            <div class="path" id="linePath"></div>
          </div>
        </div>

        <div class="panel" style="margin-bottom:10px;">
          <div class="panel-title">意图矩阵 / 投注结果正反向</div>
          <div class="panel-body">
            <table>
              <thead><tr><th>盘口/标签</th><th>样本</th><th>正向结果</th><th>反向结果</th><th>当前读法</th></tr></thead>
              <tbody id="intentMatrixRows"></tbody>
            </table>
          </div>
        </div>

        <div class="grid-2">
          <div class="panel">
            <div class="panel-title">盘口与赔率</div>
            <div class="panel-body">
              <table>
                <thead><tr><th>市场</th><th>初盘</th><th>即时</th><th>终盘</th><th>解读</th></tr></thead>
                <tbody id="marketRows"></tbody>
              </table>
            </div>
          </div>
          <div class="panel">
            <div class="panel-title">篮球基本面</div>
            <div class="panel-body" id="fundamentalRows"></div>
          </div>
        </div>

        <div class="grid-3">
          <div class="panel">
            <div class="panel-title">让分审计</div>
            <div class="panel-body" id="spreadAudit"></div>
          </div>
          <div class="panel">
            <div class="panel-title">大小分审计</div>
            <div class="panel-body" id="totalAudit"></div>
          </div>
          <div class="panel">
            <div class="panel-title">执行计划</div>
            <div class="panel-body" id="executionPlan"></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title">赛后复盘 / CLV</div>
          <div class="panel-body">
            <table>
              <thead><tr><th>原始选择</th><th>入场线</th><th>终盘线</th><th>赛果</th><th>CLV</th><th>流程评级</th></tr></thead>
              <tbody id="reviewRows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

    const qs = (id) => document.getElementById(id);
    const isCoverageRow = (m) => (
      m.id.startsWith("coverage-") ||
      m.id.includes("-empty-") ||
      m.id.includes("-source-")
    );
    const tradeMatches = () => DATA.matches.filter(m => !isCoverageRow(m));
    const params = new URLSearchParams(window.location.search);
    const requestedDate = params.get("date");
    const requestedId = params.get("id");
    let activeId = tradeMatches()[0]?.id || DATA.matches[0].id;
    if (!requestedId && DATA.defaultDate) {
      const defaultMatch = tradeMatches().find(m => m.date === DATA.defaultDate);
      if (defaultMatch) activeId = defaultMatch.id;
    }
    if (requestedId && tradeMatches().some(m => m.id === requestedId)) {
      activeId = requestedId;
    }

    const BET_STATUS_ORDER = ["可投-主单", "可投-小仓限价", "纸面模拟", "临场观察", "不可投"];

    function clsForTag(tag) {
      if (tag.includes("主单")) return "tag-main";
      if (tag.includes("观察")) return "tag-watch";
      if (tag.includes("风险")) return "tag-risk";
      return "tag-none";
    }

    function clsForBetStatus(status) {
      if (status === "可投-主单") return "tag-main";
      if (status === "可投-小仓限价") return "tag-watch";
      if (status === "纸面模拟") return "tag-watch";
      if (status === "临场观察") return "tag-none";
      return "tag-risk";
    }

    function rowKV(key, value) {
      return `<div class="kv"><div class="k">${key}</div><div class="v">${value}</div></div>`;
    }

    function matchLabel(m) {
      return `${m.home} vs ${m.away}`;
    }

    function hasScore(status = "") {
      return /\d+\s*[-:]\s*\d+/.test(status);
    }

    function namedStatus(m) {
      const status = m.status || "";
      if (!hasScore(status)) return status;
      if ((m.home && status.includes(m.home)) || (m.away && status.includes(m.away))) return status;
      const match = status.match(/(\d+)\s*[-:]\s*(\d+)/);
      if (!match) return status;
      return status.replace(match[0], `${m.home} ${match[1]}-${match[2]} ${m.away}`);
    }

    function matchMeta(m) {
      const order = hasScore(m.status) ? " | 比分顺序：主队-客队" : "";
      return `${m.league} | ${m.time} | ${namedStatus(m)}${order}`;
    }

    function compactText(value, limit = 42) {
      const text = String(value || "").replace(/\s+/g, " ").trim();
      return text.length > limit ? `${text.slice(0, limit)}...` : text;
    }

    function nonEmptyPaperReview(m) {
      const value = m.review?.[1] || "";
      return value && !value.startsWith("无") ? value : "";
    }

    function deriveBetStatus(m) {
      if (m.bet_status) return m.bet_status;
      const text = [
        m.tag,
        m.status,
        m.conclusion,
        m.ev,
        m.execution ? Object.values(m.execution).join(" ") : "",
        m.review ? m.review.join(" ") : ""
      ].join(" ");
      const paper = nonEmptyPaperReview(m);
      if (/可投-主单/.test(text)) return "可投-主单";
      if (/可投-小仓|限价/.test(text)) return "可投-小仓限价";
      if (m.tag?.includes("纸面") || /纸面/.test(paper)) return "纸面模拟";
      if (/已完赛|进行中|赛后|已开赛/.test(m.status) || /赛后回填|已开赛|不补盘|不倒推/.test(text)) return "不可投";
      if (m.tag?.includes("观察") || /观察|待赛|相邻/.test(text)) return "临场观察";
      return "不可投";
    }

    function betReason(m) {
      if (m.bet_reason) return m.bet_reason;
      const status = deriveBetStatus(m);
      const paper = nonEmptyPaperReview(m);
      if (status === "纸面模拟") return `仅进first_write_paper：${paper || m.execution?.["备选"] || "原始纸面线"}`;
      if (status === "临场观察") return m.execution?.["备注"] || m.spreadAudit?.["临场防线"] || "等待盘口、首发或临场触发";
      if (status.startsWith("可投")) return m.execution?.["备注"] || "价格、盘口路径、伤停和p_low门槛通过";
      if (/已完赛|进行中|已开赛/.test(m.status)) return "已开赛/完赛或缺最初盘口，不回补统计";
      return m.execution?.["备注"] || "硬门槛未通过，Kelly=0";
    }

    function simulationText(m) {
      const betStatus = deriveBetStatus(m);
      const backup = m.execution?.["备选"] || "无";
      const result = m.review?.[4] || "待结算";
      const line = m.review?.[1] || backup;
      return `筛选：${betStatus}；模拟投注：${line}；状态：${result}；原因：${betReason(m)}`;
    }

    function quantAuditFor(m) {
      const status = deriveBetStatus(m);
      const q = m.quant || {};
      const failedDefault = status.startsWith("可投") || status === "纸面模拟"
        ? "需由该行显式记录"
        : "未通过或未形成可执行测算";
      return {
        "量化硬闸": q["量化硬闸"] || "p_low>=55%；EV>2.5%；Line-Pred>=K(2.5-4.0)；2小时窗口；1小时>5分熔断；Steam同向；1/4 Kelly",
        "p_low/p_mid/p_high": q["p_low/p_mid/p_high"] || failedDefault,
        "breakeven/EV": q["breakeven/EV"] || failedDefault,
        "K差值": q["K差值"] || failedDefault,
        "时间锁/熔断": q["时间锁/熔断"] || failedDefault,
        "Steam同向": q["Steam同向"] || (status.startsWith("可投") ? "需复核同向" : "未知或未同向，不下注"),
        "1/4 Kelly": q["1/4 Kelly"] || "0",
        "Zero Action原因": q["Zero Action原因"] || betReason(m)
      };
    }

    function renderTop() {
      qs("stamp").textContent = `更新时间 ${DATA.updatedAt}`;
      qs("gateGrid").innerHTML = DATA.gates.map(([name, status, note]) => {
        const cls = status === "完成" || status === "硬规则" ? "ok" : status === "待核" ? "warn" : "bad";
        return `<div class="gate"><b>${name}</b><span class="${cls}">${status}</span><div class="small">${note}</div></div>`;
      }).join("");
      qs("sourceRows").innerHTML = DATA.sources.map(([source, status, note]) =>
        `<tr><th>${source}</th><td>${status}</td><td>${note}</td></tr>`
      ).join("");
      const alertDate = qs("dateSelect").value || DATA.defaultDate || tradeMatches()[0]?.date;
      const alertTerm = qs("search").value.trim().toLowerCase();
      const alertMatches = tradeMatches().filter(m => {
        const hay = `${m.league} ${m.home} ${m.away} ${m.tag}`.toLowerCase();
        return m.date === alertDate && (!alertTerm || hay.includes(alertTerm));
      });
      const counts = Object.fromEntries(BET_STATUS_ORDER.map(label => [label, 0]));
      alertMatches.forEach(m => { counts[deriveBetStatus(m)] = (counts[deriveBetStatus(m)] || 0) + 1; });
      qs("betSummary").innerHTML = BET_STATUS_ORDER.map(label =>
        `<div class="bet-chip"><b>${label}</b><span>${counts[label] || 0}场</span></div>`
      ).join("");
      qs("intentMatrixRows").innerHTML = alertMatches.length
        ? DATA.intentMatrix.map(row =>
          `<tr><th>${row[0]}</th><td>${row[1]}</td><td>${row[2]}</td><td>${row[3]}</td><td>${row[4]}</td></tr>`
        ).join("")
        : `<tr><td colspan="5">当前日期无真实比赛，不调用历史矩阵生成今日读法。</td></tr>`;
      qs("alertRows").innerHTML = alertMatches.map(m => {
        const status = deriveBetStatus(m);
        return `<tr><td>${matchLabel(m)}</td><td><span class="tag ${clsForBetStatus(status)}">${status}</span></td><td>${compactText(betReason(m))}</td><td>${m.tag}</td></tr>`;
      }).join("") || `<tr><td colspan="4">当前日期无真实比赛，不生成可投筛选。</td></tr>`;
    }

    function renderDates() {
      const dates = [...new Set([DATA.defaultDate, ...tradeMatches().map(m => m.date)].filter(Boolean))].sort();
      qs("dateSelect").innerHTML = dates.map(d => `<option>${d}</option>`).join("");
      const activeDate = DATA.matches.find(m => m.id === activeId)?.date;
      if (requestedDate && dates.includes(requestedDate)) {
        qs("dateSelect").value = requestedDate;
      } else if (DATA.defaultDate && dates.includes(DATA.defaultDate)) {
        qs("dateSelect").value = DATA.defaultDate;
      } else if (activeDate && dates.includes(activeDate)) {
        qs("dateSelect").value = activeDate;
      }
    }

    function filteredMatches() {
      const date = qs("dateSelect").value;
      const term = qs("search").value.trim().toLowerCase();
      return tradeMatches().filter(m => {
        const hay = `${m.league} ${m.home} ${m.away} ${m.tag}`.toLowerCase();
        return m.date === date && (!term || hay.includes(term));
      });
    }

    function renderList() {
      const rows = filteredMatches();
      qs("matchCount").textContent = `${rows.length}场`;
      if (!rows.find(m => m.id === activeId) && rows[0]) activeId = rows[0].id;
      qs("matchList").innerHTML = rows.map(m => `
        <button class="match-item ${m.id === activeId ? "active" : ""}" data-id="${m.id}">
          <div>
            <div class="match-main">${matchLabel(m)}</div>
            <div class="match-meta">${matchMeta(m)}</div>
          </div>
          <span class="tag ${clsForBetStatus(deriveBetStatus(m))}">${deriveBetStatus(m)}</span>
        </button>
      `).join("") || `<div style="padding:14px;line-height:1.6;color:var(--muted);">当前日期无真实比赛；覆盖状态见上方门槛和数据源表。</div>`;
      document.querySelectorAll(".match-item").forEach(btn => {
        btn.addEventListener("click", () => {
          activeId = btn.dataset.id;
          renderList();
          renderDetail();
        });
      });
    }

    function renderDetail() {
      if (!filteredMatches().length) {
        const date = qs("dateSelect").value || DATA.defaultDate;
        qs("selectedTitle").textContent = "当日无主赛程";
        qs("selectedMeta").textContent = `北京时间 ${date}`;
        qs("selectedStatus").textContent = "0场";
        qs("coldConclusion").textContent = "按 skill 完成覆盖源检查；当前日期没有真实篮球比赛进入盘口分析，不插入假比赛行。";
        qs("evBadge").textContent = "真实下注：无。无比赛、无完整价格链，Kelly=0。";
        qs("completeness").innerHTML = [
          ["比分源", "ESPN/NBA Stats/TheSportsDB/FIBA/WNBA official 已查或标源不可用"],
          ["盘口路径", "无目标比赛进入盘口阶段"],
          ["伤停首发", "无目标比赛，不生成伪字段"],
          ["公众资金", "无目标比赛，不生成伪字段"],
          ["节奏效率", "无目标比赛，不生成伪字段"]
        ].map(([k, v]) => rowKV(k, v)).join("");
        qs("linePath").innerHTML = ["初盘", "即时", "终盘"].map(k => `<div class="step"><b>${k}</b><div>无目标比赛</div></div>`).join("");
        qs("marketRows").innerHTML = `<tr><td colspan="5">当前日期无真实比赛，不形成盘口路径。</td></tr>`;
        qs("intentMatrixRows").innerHTML = `<tr><td colspan="5">当前日期无真实比赛，不调用历史矩阵生成今日读法。</td></tr>`;
        qs("fundamentalRows").innerHTML = [["轮换伤停", "无目标比赛"], ["休息赛程", "无目标比赛"], ["节奏", "无目标比赛"], ["对位", "无目标比赛"], ["公众拉力", "无目标比赛"]].map(([k, v]) => rowKV(k, v)).join("");
        qs("spreadAudit").innerHTML = [["意图标签", "无赛"], ["正反向验证", "未形成"], ["盘口意图", "无目标比赛"], ["可打线", "无"], ["停止线", "无"], ["临场防线", "无"]].map(([k, v]) => rowKV(k, v)).join("");
        qs("totalAudit").innerHTML = [["盘口意图", "无目标比赛"], ["可打线", "无"], ["停止线", "无"], ["临场防线", "无"]].map(([k, v]) => rowKV(k, v)).join("");
        qs("executionPlan").innerHTML = [["主单", "不投"], ["备选", "无"], ["Kelly", "0"], ["最大入场", "无"], ["备注", "空日期覆盖更新"]].map(([k, v]) => rowKV(k, v)).join("");
        qs("reviewRows").innerHTML = `<tr><td colspan="6">当前日期无赛后复盘对象。</td></tr>`;
        return;
      }
      const m = DATA.matches.find(item => item.id === activeId) || DATA.matches[0];
      qs("selectedTitle").textContent = matchLabel(m);
      qs("selectedMeta").textContent = `${m.league} | 北京时间 ${m.time} | 主队在前，比分按主队-客队`;
      qs("selectedStatus").textContent = namedStatus(m);
      qs("coldConclusion").textContent = simulationText(m);
      qs("evBadge").textContent = "";
      qs("evBadge").style.display = "none";
      qs("completeness").innerHTML = Object.entries(m.completeness).map(([k, v]) => rowKV(k, v)).join("");
      qs("linePath").innerHTML = [
        ["初盘", m.market.map(r => `${r[0]}: ${r[1]}`).join("<br>")],
        ["即时", m.market.map(r => `${r[0]}: ${r[2]}`).join("<br>")],
        ["终盘", m.market.map(r => `${r[0]}: ${r[3]}`).join("<br>")]
      ].map(([k, v]) => `<div class="step"><b>${k}</b><div>${v}</div></div>`).join("");
      qs("marketRows").innerHTML = m.market.map(r =>
        `<tr><th>${r[0]}</th><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`
      ).join("");
      qs("fundamentalRows").innerHTML = Object.entries(m.fundamentals).map(([k, v]) => rowKV(k, v)).join("");
      qs("spreadAudit").innerHTML = Object.entries(m.spreadAudit).map(([k, v]) => rowKV(k, v)).join("");
      qs("totalAudit").innerHTML = Object.entries(m.totalAudit).map(([k, v]) => rowKV(k, v)).join("");
      qs("executionPlan").innerHTML = [
        ...Object.entries(m.execution),
        ...Object.entries(quantAuditFor(m))
      ].map(([k, v]) => rowKV(k, v)).join("");
      qs("reviewRows").innerHTML = `<tr>${m.review.map(x => `<td>${x}</td>`).join("")}</tr>`;
    }

    qs("dateSelect").addEventListener("change", () => { renderTop(); renderList(); renderDetail(); });
    qs("search").addEventListener("input", () => { renderTop(); renderList(); });
    renderDates();
    renderTop();
    renderList();
    renderDetail();
  </script>
</body>
</html>
