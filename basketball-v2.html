<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>篮球量化交易 · 数据核验与纸面模拟</title><style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#142e40;background:#f3f6f9}body{margin:0;padding:24px;max-width:1400px;margin:auto}h1{font-size:25px}h2{font-size:20px}h3{font-size:16px}.bar,.card{background:white;border:1px solid #d9e2ec;border-radius:10px;padding:18px;margin-bottom:16px}.sub{color:#5b7182;font-size:13px;line-height:1.8}.warn{color:#a95b00}.bad{color:#a42727}.good{color:#147457}.badge{display:inline-block;padding:7px 12px;background:#fbe8e8;border-radius:6px;font-size:19px;font-weight:750}.observe{background:#fff2d6;color:#9b5900}.can{background:#d9f3e7;color:#136546}.metric{display:inline-block;padding:9px 20px 9px 0;font-size:14px}.metric b{display:block;font-size:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid>div{background:#f6f9fc;border:1px solid #dce5ef;border-radius:6px;padding:14px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #dce5ef;white-space:nowrap}th{background:#f3f7fb}details{margin-top:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}select,button{padding:8px 12px;border:1px solid #bccad6;border-radius:5px;background:white}.foot{margin-top:20px}.missing{color:#8b650c}@media(max-width:720px){body{padding:12px}.grid{grid-template-columns:1fr}.metric{padding-right:12px}h1{font-size:21px}.bar,.card{padding:12px}}</style>
<h1>篮球量化交易 · 纸面模拟</h1><div class="bar"><strong>真实执行：关闭</strong>　模型：未校准研究基线　<label>北京时间日期 <select id="date"></select></label><div class="sub" id="meta">正在载入</div></div><div class="bar" id="funnel"></div><div id="rows"></div><div class="sub foot">原生前向、包内核查、比分重建、旧版记录分开计数。观察/阻塞不是下注。缺少原文、方向或规则不能用近似值凑成可投。</div>
<script>
const esc=x=>String(x??'未获取').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=x=>x==null?'未获取':Number(x).toFixed(2).replace(/\.00$/,'');
function fair(e,m){if(m==null)return '未获取';return esc(m>=0?e.team1_name:e.team2_name)+' '+(m===0?'平手（0分）':'让 '+num(Math.abs(m))+' 分（-'+num(Math.abs(m))+'）');}
function quoteLabel(e,q){if(q.raw_line==null)return '未获取';if(q.market_type==='TOTAL')return '总分 '+num(q.raw_line)+' 分';if(q.direction_verified&&q.line_team1!=null)return esc(e.team1_name)+' '+(q.line_team1<0?'让 ':'受让 ')+num(Math.abs(q.line_team1))+' 分（'+(q.line_team1>=0?'+':'')+num(q.line_team1)+'）';return '方向未核验（幅度 '+num(Math.abs(q.raw_line))+' 分）';}
function priceLabel(q){return q.decimal_prices?q.decimal_prices.map(num).join(' / '):'原水位 '+(q.raw_prices||[]).map(num).join(' / ')+'；格式/双边待核验';}
function selectionLabel(e,s){if(!s)return '无可执行方向';if(s.market_type==='TOTAL')return (s.selection==='OVER'?'大于 ':'小于 ')+num(s.line)+'分 @ '+num(s.decimal_odds);let team=s.selection==='TEAM1'?e.team1_name:e.team2_name;return esc(team)+' '+(s.line>=0?'+':'')+num(s.line)+' @ '+num(s.decimal_odds);}
const dataRoot=new URL('./basketball-data/',location.href);
async function get(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status+' '+u);return r.json();}
function legacyRow(r){return '<div class="card"><h2>'+esc(r.match||r.title||r.teams||r.id||'旧版历史记录')+'</h2><div class="sub">旧版迁移记录；不计入修复版验证样本。</div><details><summary>查看原始历史字段</summary><pre>'+esc(JSON.stringify(r,null,2))+'</pre></details></div>';}
function render(d){document.querySelector('#meta').textContent='资料类型：'+(d.archive_type||'旧版记录')+' ｜ 数据截止：'+(d.asof||d.generated_at||'未知')+' ｜ 页面生成：'+(d.generated_at||'未知')+' ｜ '+(d.message||'');
 const f=d.funnel||{};const keys=[['赛事','events'],['有盘口记录','market_observed_events'],['新鲜原始盘口','fresh_market_events'],['独立研究定价','independent_priceable_events'],['同场同规则比较','comparable_events'],['纸面触发','paper_triggered_events']];
 document.querySelector('#funnel').innerHTML=keys.map(([n,k])=>'<span class="metric">'+n+'<b>'+esc(f[k]??'—')+'</b></span>').join('')+'<div class="warn">'+(f.comparable_events>0?'已比较样本内纸面可投：'+esc(f.paper_bettable)+'场；不代表全部赛事。':'可投结论：暂不可判断，暂无同场同规则有效比较。')+'</div>';
 document.querySelector('#rows').innerHTML=(d.events||[]).map(r=>{if(!r.event||r.generation!=='REPAIR_V22')return legacyRow(r);let e=r.event,p=r.pricing,a=r.execution,qs=r.market.quotes||[];return '<article class="card"><h2>'+esc(e.team1_name)+' vs '+esc(e.team2_name)+'</h2><div class="sub">'+esc(e.league)+' ｜ '+esc(e.tip_time_bj)+' ｜ '+esc(e.event_id)+'</div><p><span class="badge '+(a.shadow_action==='WATCH'?'observe':a.triggered?'can':'')+'">'+esc(a.display_action)+'</span></p><p><strong>操作方向：</strong>'+selectionLabel(e,a.triggered?a.selected:null)+'</p><div class="bad">'+esc((r.display.reasons||[]).join('；')||'已完成纸面规则判断')+'</div><div class="grid"><div><h3>模型定价（不是投注方向）</h3>独立比分基线：<b>'+fair(e,p.mu_raw)+'</b><p>模型总分：<b>'+num(p.total_raw)+'分</b>　口径：含加时比分均值</p><div class="sub">有效历史 '+esc(p.input_games??0)+' 场；证据质量 '+esc(p.pricing_data_quality??0)+'/100<br>'+esc((r.display.warnings||[]).join('；'))+'</div></div><div><h3>盘口与执行</h3><div>最新记录：'+esc(qs.length)+'条（不是比赛数）</div><p>正式预期收益：'+(a.ev==null?'未计算：合同/输入尚不完整':num(a.ev*100)+'%')+'</p><div class="sub">共识不是可成交价格；未确认加时规则不会被偷偷按含加时处理。</div></div></div><details><summary>盘口原文、公司、双方水位与时效</summary><div class="tablewrap"><table><thead><tr><th>公司</th><th>盘口</th><th>价格</th><th>源时间</th><th>接收时间</th><th>规则</th></tr></thead><tbody>'+qs.map(q=>'<tr><td>'+esc(q.bookmaker||q.bookmaker_id)+'</td><td>'+quoteLabel(e,q)+'</td><td>'+priceLabel(q)+'</td><td>'+esc(q.source_quote_at)+'</td><td>'+esc(q.received_at)+'</td><td>'+esc(q.ot_rule)+'</td></tr>').join('')+'</tbody></table></div></details><details><summary>输入证据与技术审计</summary><pre>'+esc(JSON.stringify({pricing:p,execution:a,identity:e},null,2))+'</pre></details></article>';}).join('')||'<div class="card">本日期没有可显示记录。请检查采集错误，不能将此解释为全球没有比赛。</div>';}
(async()=>{try{if(window.__AUDIT_DATA__){document.querySelector('#date').innerHTML='<option>包内核查</option>';render(window.__AUDIT_DATA__);return;}const index=await get(new URL('index.json',dataRoot));const entries=(index.dates||[]).map(x=>typeof x==='string'?{date:x,file:x+'.json'}:x);const sel=document.querySelector('#date');sel.innerHTML=entries.map(x=>'<option value="'+esc(x.file||x.date+'.json')+'">'+esc(x.date)+'</option>').join('');sel.onchange=async()=>{try{render(await get(new URL(sel.value,dataRoot)))}catch(e){document.querySelector('#meta').textContent=e.message}};const latest=await get(new URL('latest.json',dataRoot));sel.value=(latest.date_bj||latest.date||'')+'.json';render(latest);}catch(e){document.querySelector('#meta').textContent='数据载入失败：'+e.message+'；本地预览请通过HTTP服务，不要双击在线版HTML。'}})();
</script></html>
