<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>篮球量化交易 · Dashboard v2</title>
<style>
:root{--ink:#172b3a;--muted:#6a7b87;--line:#dbe4e9;--blue:#123b5d;--mint:#e7f5ef;--amber:#fff4dc;--red:#b42318;--green:#13795b;--bg:#f5f8f9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1240px;margin:auto;padding:22px}.top{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}.eyebrow{color:var(--muted);font-size:12px}.title{font-size:28px;font-weight:750;letter-spacing:0}.controls{display:flex;gap:8px;align-items:center}select{border:1px solid #b9cbd4;background:#fff;padding:9px 12px;color:var(--ink)}.statusbar,.funnel,.quality,.panels{display:grid;gap:10px;margin-top:16px}.statusbar{grid-template-columns:repeat(6,1fr)}.funnel{grid-template-columns:repeat(9,1fr)}.stat,.funnel div,.panel,.event{background:#fff;border:1px solid var(--line);border-radius:6px}.stat{padding:12px}.stat b{display:block;font-size:15px}.stat span,.small{color:var(--muted);font-size:12px}.ok{color:var(--green)}.warn{color:#a15c00}.off{color:var(--red)}.funnel div{padding:10px}.funnel strong{display:block;font-size:22px}.section{margin:24px 0 10px;font-size:16px;font-weight:750}.event{margin-top:10px;overflow:hidden}.eventhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff}.match{font-size:18px;font-weight:700}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}.chip{padding:3px 7px;border-radius:12px;background:#eef3f5;color:#52636d;font-size:12px}.chip.green{background:var(--mint);color:var(--green)}.chip.amber{background:var(--amber);color:#8a5700}.chip.red{background:#fdebea;color:var(--red)}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:10px;padding:0 10px 10px}.panel{padding:14px}.panel h3{margin:0 0 10px;font-size:14px}.compare{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.compare div{background:#f7fafb;padding:9px;border:1px solid var(--line)}.compare b{display:block;font-size:16px}.compare small{color:var(--muted)}.rows{display:grid;grid-template-columns:1fr auto;gap:5px}.null{color:#9aa7ad}.bar{height:7px;background:#edf1f3;margin:5px 0 12px}.bar i{display:block;height:100%;background:#4e8a77}.footer{margin-top:24px;color:var(--muted);font-size:12px;text-align:center}.hidden{display:none}@media(max-width:760px){main{padding:14px}.top{align-items:flex-start;gap:10px;flex-direction:column}.title{font-size:23px}.statusbar{grid-template-columns:repeat(2,1fr)}.funnel{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.compare{grid-template-columns:repeat(2,1fr)}.eventhead{align-items:flex-start;gap:8px;flex-direction:column}}
</style></head>
<body><main><header class="top"><div><div class="eyebrow">BASKETBALL QUANTITATIVE TRADING</div><div class="title">北京 <span id="date">2026-09-13</span></div><div class="small">只读监控 · shadow paper mode</div></div><div class="controls"><label class="small" for="day">历史日期</label><select id="day"><option>2026-09-13</option><option>2026-09-12</option></select></div></header>
<section class="statusbar"><div class="stat"><span>Discovery</span><b class="ok">READY</b></div><div class="stat"><span>7M market feed</span><b class="ok">MVP READY</b></div><div class="stat"><span>Pricing engine</span><b class="ok">READY</b></div><div class="stat"><span>Paper mode</span><b>ACTIVE</b></div><div class="stat"><span>Real execution</span><b class="off">DISABLED</b></div><div class="stat"><span>Last updated</span><b id="updated">--</b></div></section>
<div class="section">今日漏斗</div><section class="funnel" id="funnel"></section><div class="section">比赛与定价</div><section id="events"></section>
<div class="section">校准样本</div><section class="panel" id="calibration"></section><div class="footer">Intent 标签仅属于市场解释审计区，不参与模型概率和 EV 计算。真实执行始终关闭。</div></main>
<script>
const $=s=>document.querySelector(s);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=(x,s='未获取')=>x===null||x===undefined?s:esc(x);const chip=(x,c='')=>`<span class="chip ${c}">${esc(x)}</span>`;
async function load(day){let d=await fetch(`data/${day}.json`,{cache:'no-store'}).then(r=>r.json());$('#date').textContent=d.date_bj;$('#updated').textContent=d.last_updated.replace('T',' ').replace('+08:00','');let f=d.funnel;let items=[['赛事',f.events],['有盘口',f.market],['enrichment完成',f.enrichment_complete],['可定价',f.priceable],['EDGE',f.edge],['LEAN',f.lean],['WATCH',f.watch],['PASS',f.pass],['BLOCKED',f.blocked]];$('#funnel').innerHTML=items.map(x=>`<div><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('');$('#events').innerHTML=d.events.length?d.events.map(render).join(''):`<div class="panel">该日期没有可展示事件。</div>`;let c=d.calibration;$('#calibration').innerHTML=`<div class="rows"><span>forward priced</span><b>${c.forward_priced}</b><span>market tape</span><b>${c.market_tape}</b><span>coupled</span><b>${c.coupled}</b><span>settled</span><b>${c.settled}</b><span>CLV samples</span><b>${c.clv_samples}</b></div><p class="small">样本积累中，不显示胜率结论。</p>`}
function render(x){let e=x.event,p=x.pricing,s=x.market,q=x.enrichment||{};let fs=p.fair_spread,ft=p.fair_total;return `<article class="event"><div class="eventhead"><div><div class="match">${esc(e.match)}</div><div class="small">${esc(e.tip_time_bj)} · ${esc(e.league)}</div><div class="chips">${chip(p.status,p.status==='UNPRICEABLE'?'red':'amber')}${chip(x.execution.shadow_action,x.execution.shadow_action==='BLOCKED'?'red':'')}${s.status==='REAL_MARKET'?chip('REAL MARKET','green'):chip('NO MARKET')}</div></div><div class="small">${esc(x.discovery.source)}<br>${esc(x.discovery.status)}</div></div><div class="grid"><section class="panel"><h3>Model vs Market · Spread</h3><div class="compare"><div><small>RAW MODEL</small><b>${val(fs.raw)}</b></div><div><small>STRUCTURAL</small><b>${val(fs.structural)}</b></div><div><small>MARKET</small><b>${val(fs.market)}</b></div><div><small>BLENDED</small><b>${val(fs.blended)}</b></div></div><h3 style="margin-top:14px">Total</h3><div class="compare"><div><small>RAW</small><b>${val(ft.raw)}</b></div><div><small>STRUCTURAL</small><b>${val(ft.structural)}</b></div><div><small>MARKET</small><b>${val(ft.market)}</b></div><div><small>BLENDED</small><b>${val(ft.blended)}</b></div></div></section><section class="panel"><h3>Enrichment</h3><div class="rows"><span>national prior</span><b class="ok">${q.prior||'MISSING'}</b><span>roster</span><b class="ok">${q.roster||'MISSING'}</b><span>role/minutes</span><b class="warn">${q.role_minutes||'MISSING'}</b><span>recent form</span><b class="ok">${q.recent_form||'MISSING'}</b><span>schedule/rest</span><b class="ok">${q.schedule_rest||'MISSING'}</b><span>injury</span><b class="warn">${q.injury||'UNKNOWN'}</b></div><h3 style="margin-top:14px">Data quality</h3><strong>${val(p.quality,0)} / 100</strong><div class="bar"><i style="width:${Math.max(0,Math.min(100,p.quality||0))}%"></i></div><div class="small">低分原因：国家队角色分钟为降级证据，伤停未知，且当前没有可绑定市场。</div></section><section class="panel"><h3>Market tape</h3>${s.tape&&s.tape.length?`<div class="rows">${s.tape.map(t=>`<span>${esc(t.timestamp)}</span><b>${t.spread} · ${t.spread_price}</b>`).join('')}</div><p class="small">${esc(s.tape_note||'')}</p>`:`<span class="null">未获取市场，fair market / blended 保持 null。</span>`}</section><section class="panel"><h3>Execution · Shadow only</h3><div class="rows"><span>model state</span><b>${esc(x.execution.shadow_action)}</b><span>blocker</span><b class="warn">${esc(x.execution.blocker)}</b><span>no-chase</span><b class="ok">${esc(x.execution.no_chase)}</b></div><p class="off"><b>REAL EXECUTION DISABLED</b></p></section></div></article>`}
$('#day').onchange=()=>load($('#day').value);load('2026-09-13');
</script></body></html>
