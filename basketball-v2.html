<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>篮球量化交易 · 纸面模拟</title>
<style>
:root{--ink:#172b3a;--muted:#687984;--line:#dbe4e9;--bg:#f5f8f9;--green:#13795b;--orange:#a15c00;--red:#a12822}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1240px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:16px}.eyebrow,.small{color:var(--muted);font-size:12px}.title{font-size:27px;font-weight:750}.controls{display:flex;gap:8px;align-items:center}select{border:1px solid #b9cbd4;background:#fff;padding:8px 12px;color:var(--ink)}.statusbar,.funnel{display:grid;gap:9px;margin-top:15px}.statusbar{grid-template-columns:repeat(6,1fr)}.funnel{grid-template-columns:repeat(9,1fr)}.stat,.funnel>div,.panel,.event,.summary{background:#fff;border:1px solid var(--line);border-radius:6px}.stat{padding:10px}.stat b{display:block;font-size:14px}.ok{color:var(--green)}.warn{color:var(--orange)}.off{color:var(--red)}.funnel>div{padding:9px}.funnel strong{display:block;font-size:21px}.section{margin:23px 0 9px;font-size:16px;font-weight:750}.legend{display:flex;gap:9px;flex-wrap:wrap;color:var(--muted);font-size:12px}.legend span{padding:6px 9px;background:#fff;border:1px solid var(--line);border-radius:5px}.summary{overflow:auto}.summary table{width:100%;border-collapse:collapse;min-width:900px}.summary th,.summary td{text-align:left;padding:9px;border-bottom:1px solid var(--line);white-space:nowrap}.summary th{font-size:12px;color:var(--muted);background:#f8fafb}.event{margin-top:11px;overflow:hidden}.eventhead{padding:14px 16px;border-bottom:1px solid var(--line)}.matchrow{display:flex;justify-content:space-between;gap:12px}.match{font-size:19px;font-weight:750}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}.chip{padding:3px 8px;border-radius:12px;background:#eef3f5;color:#52636d;font-size:12px}.chip.green{background:#e7f5ef;color:var(--green)}.chip.amber{background:#fff2d8;color:#8a5700}.chip.red{background:#fdebea;color:var(--red)}.final{margin-top:13px;padding:13px 15px;border-left:7px solid var(--orange);background:#fff2d8}.final.green{border-color:var(--green);background:#e7f5ef}.final.blue{border-color:#2563a8;background:#eaf2fb}.final.red{border-color:var(--red);background:#fdebea}.final b{display:block;font-size:24px;line-height:1.15}.final p{margin:4px 0 0}.conclusion{margin-top:10px;padding:13px 15px;background:#f8fafb;border:1px solid var(--line);border-radius:5px}.conclusion h3{margin:0 0 8px;font-size:15px}.rows{display:grid;grid-template-columns:1fr auto;gap:5px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:10px;padding:10px}.panel{padding:13px}.panel h3{margin:0 0 9px;font-size:14px}.compare{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.compare div{background:#f7fafb;padding:8px;border:1px solid var(--line)}.compare b{display:block;font-size:16px}.compare small{color:var(--muted)}.quality-list{margin:8px 0 0;padding:0;list-style:none}.quality-list li{margin:3px 0}.quality-list .yes{color:var(--green)}.quality-list .limited{color:var(--orange)}.quality-list .unknown{color:#687984}.quality-list .missing{color:var(--red)}.footer{margin:24px 0;color:var(--muted);font-size:12px;text-align:center}@media(max-width:760px){main{padding:13px}.top{align-items:flex-start;gap:10px;flex-direction:column}.title{font-size:23px}.statusbar{grid-template-columns:repeat(2,1fr)}.funnel{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.compare{grid-template-columns:repeat(2,1fr)}.matchrow{flex-direction:column}}
</style><script>const _fetch=window.fetch.bind(window);window.fetch=(input,...rest)=>{if(typeof input==='string'&&input.startsWith('data/')){const fallback=input;return _fetch('./basketball-data/'+input.slice(5),...rest).then(r=>r.ok?r:_fetch(fallback,...rest))}return _fetch(input,...rest)};async function loadJson(day){for(const path of [`./basketball-data/${day}.json`,`./data/${day}.json`]){try{const r=await _fetch(path,{cache:'no-store'});if(r.ok)return r.json()}catch(e){}}throw new Error('数据文件不可用：'+day)}</script></head>
<body><main><header class="top"><div><div class="eyebrow">篮球量化交易 · DASHBOARD V2</div><div class="title">北京 <span id="date">2026-09-13</span></div><div class="small">当前模式：纸面模拟　|　模型验证：样本积累中　|　真实执行：关闭</div></div><div class="controls"><label class="small" for="day">历史日期</label><select id="day"><option>2026-09-13</option><option>2026-09-12</option></select></div></header>
<section class="statusbar"><div class="stat"><span>赛事发现</span><b class="ok">已就绪</b></div><div class="stat"><span>7M 盘口源</span><b class="ok">已就绪</b></div><div class="stat"><span>定价引擎</span><b class="ok">已就绪</b></div><div class="stat"><span>当前模式</span><b>纸面模拟</b></div><div class="stat"><span>真实执行</span><b class="off">已关闭</b></div><div class="stat"><span>更新时间</span><b id="updated">--</b></div></section>
<div class="section">今日漏斗</div><section class="funnel" id="funnel"></section><div class="section">结论图例</div><div class="legend"><span><b class="ok">纸面可投</b>：模型与盘口通过纸面条件</span><span><b style="color:#2563a8">纸面限价可投</b>：达到指定价格才进入纸面单</span><span><b class="warn">观察</b>：有模型观点，但缺少执行条件</span><span><b class="off">不可投</b>：存在模型、盘口或数据硬阻塞</span></div><div class="section">比赛结论</div><section id="events"></section><div class="footer">页面中的“可投”仅代表纸面模拟，不代表实盘建议；真实执行始终关闭。市场解释标签不参与公平盘口、概率、EV 或模型判断计算。</div></main>
<script>
const $=s=>document.querySelector(s);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const val=x=>x===null||x===undefined?'未获取':esc(x);const reasonMap={NO_MARKET:'暂无可验证盘口',UNPRICEABLE:'模型数据不足，暂时无法定价',UNKNOWN_OT_RULE:'加时结算规则未确认',STALE_MARKET:'当前盘口已过期',PRICE_EXHAUSTED:'当前价格已透支，不追价',INJURY_STALE:'伤停信息不够新',ROSTER_UNKNOWN:'阵容尚未确认',PENDING_REPRICE:'有新信息，等待重新定价',PROVIDER_DISAGREEMENT:'多数据源盘口分歧过大',LOW_DATA_QUALITY:'数据完整度不足'};
function statusOf(x){let a=x.execution?.shadow_action||'BLOCKED';if(x.pricing?.status==='UNPRICEABLE')return ['不可投','red'];if(a==='SHADOW_BET')return ['纸面可投','green'];if(a==='SHADOW_LIMIT_ONLY')return ['纸面限价可投','blue'];if(a==='WATCH')return ['观察','amber'];return ['不可投','red']}
function primaryReason(x){let b=String(x.execution?.blocker||'').split(/[+,| ]/).filter(Boolean);if(x.market?.status==='NO_MARKET')return reasonMap.NO_MARKET;if(x.pricing?.status==='UNPRICEABLE')return reasonMap.UNPRICEABLE;return reasonMap[b[0]]||'当前不满足纸面执行条件'}
function modelText(x){return {PRICED:'已完成定价',PRICED_LOW_CONFIDENCE:'低置信度可定价',MARKET_ANCHORED:'市场锚定定价',UNPRICEABLE:'无法定价'}[x.pricing?.status]||x.pricing?.status||'未确认'}
function formatSpreadWithTeam(x,margin,team){if(margin===null||margin===undefined)return '未获取';if(!team)return `盘口方向未确认（${esc(margin)}）`;let n=Number(margin),sign=n<0?' -':' +';return `${esc(team)}${sign}${Math.abs(n)}`}
function fairDirection(x,margin){if(margin===null||margin===undefined)return '未获取';let teams=x.event.match.split(' vs ');return formatSpreadWithTeam(x,Number(margin),teams[1]||null)}
function marketDirection(x,margin,selection){if(margin===null||margin===undefined)return '未获取';let teams=x.event.match.split(' vs ');if(selection==='home')return formatSpreadWithTeam(x,margin,teams[0]||null);if(selection==='away')return formatSpreadWithTeam(x,margin,teams[1]||null);return `盘口方向未确认（${esc(margin)}）`}
function quality(x){let p=x.pricing||{},q=x.enrichment||{};return `<div><b>数据完整度：${val(p.quality)}/100</b>（${(p.quality||0)<50?'偏低':'良好'}）</div><ul class="quality-list"><li class="yes">✓ 国家队实力：${q.prior||'缺失'}</li><li class="yes">✓ 正式阵容：${q.roster||'缺失'}</li><li class="yes">✓ 近期状态：${q.recent_form||'缺失'}</li><li class="yes">✓ 赛程休息：${q.schedule_rest||'缺失'}</li><li class="limited">△ 球员预计时间：${q.role_minutes||'缺失'}</li><li class="unknown">? 伤停：${q.injury||'未确认'}</li><li class="missing">× 可验证盘口：${x.market?.status==='REAL_MARKET'?'已获取':'缺失'}</li></ul>`}
function render(x){let e=x.event,p=x.pricing||{},s=x.market||{},fs=p.fair_spread||{},ft=p.fair_total||{},st=statusOf(x),r=primaryReason(x),tape=s.tape||[],selection=tape[0]?.selection||(s.source==='7M aggregate'?'home':null);let detail=st[0]==='观察'?'模型已完成低置信度定价，但暂无真实盘口，无法判断是否存在可交易价格。':st[0]==='不可投'?'已获取真实盘口，但模型数据不足，无法判断当前价格是否存在优势。':r;return `<article class="event"><div class="eventhead"><div class="matchrow"><div><div class="match">${esc(e.match)}</div><div class="small">${esc(e.tip_time_bj)} ｜ ${esc(e.league)}</div><div class="chips"><span class="chip">${modelText(x)}</span><span class="chip ${s.status==='REAL_MARKET'?'green':''}">${s.status==='REAL_MARKET'?'真实盘口':'暂无盘口'}</span></div></div><div class="small">${esc(x.discovery.source)}<br>数据来源：${esc(x.discovery.status)}</div></div><div class="final ${st[1]}"><b>【${st[0]}】</b><p>首要原因：${esc(r)}</p><p class="small">${detail}</p></div><div class="conclusion"><h3>操作结论</h3><div class="rows"><span>状态</span><b>${st[0]}</b><span>方向</span><b>${fairDirection(x,fs.structural)}</b><span>可用盘口</span><b>${marketDirection(x,fs.market,selection)}</b><span>主要原因</span><b>${esc(r)}</b><span>停止追价</span><b>${x.execution?.no_chase==='YES'?'是':'未设置'}</b></div></div></div><div class="grid"><section class="panel"><h3>模型 vs 市场</h3><div class="compare"><div><small>原始模型让分</small><b>${fairDirection(x,fs.raw)}</b></div><div><small>结构修正让分</small><b>${fairDirection(x,fs.structural)}</b></div><div><small>市场让分</small><b>${marketDirection(x,fs.market,selection)}</b></div><div><small>融合定价</small><b>${fairDirection(x,fs.blended)}</b></div></div><h3 style="margin-top:14px">总分</h3><div class="compare"><div><small>原始模型</small><b>${ft.raw===null?'未获取':val(ft.raw)+'分'}</b></div><div><small>结构修正</small><b>${ft.structural===null?'未获取':val(ft.structural)+'分'}</b></div><div><small>市场大小分</small><b>${ft.market===null?'未获取':val(ft.market)+'分'}</b></div><div><small>融合定价</small><b>${ft.blended===null?'未获取':val(ft.blended)+'分'}</b></div></div></section><section class="panel"><h3>数据补全</h3>${quality(x)}</section><section class="panel"><h3>盘口走势</h3>${tape.length?`<div class="rows">${tape.map(t=>`<span>${esc(t.timestamp)}</span><b>${marketDirection(x,t.spread,t.selection||selection)} @ ${t.spread_price}</b>`).join('')}</div><p class="small">${esc(s.tape_note||'')}</p>`:`<span class="null">未获取盘口，市场与融合定价保持未获取。</span>`}</section><section class="panel"><h3>执行判断 · 纸面模拟</h3><div class="rows"><span>模型判断</span><b>${st[0]}</b><span>阻塞原因</span><b class="warn">${esc(x.execution?.blocker||'无')}</b><span>是否禁止追价</span><b>${x.execution?.no_chase==='YES'?'是':'否'}</b></div><p class="off"><b>真实执行已关闭</b></p></section></div></article>`}
async function load(day){let d=await fetch(`data/${day}.json`,{cache:'no-store'}).then(r=>r.json());$('#date').textContent=d.date_bj;$('#updated').textContent=d.last_updated.replace('T',' ').replace('+08:00','');let f=d.funnel||{};let items=[['发现赛事',f.events],['有真实盘口',f.market],['数据补全',f.enrichment_complete],['可独立定价',f.priceable],['coupled',f.coupled||0],['EDGE',f.edge],['LEAN',f.lean],['观察',f.watch],['不可投',f.blocked||f.pass]];$('#funnel').innerHTML=items.map(x=>`<div><span>${x[0]}</span><strong>${x[1]??0}</strong></div>`).join('');$('#events').innerHTML=d.events?.length?d.events.map(render).join(''):`<div class="panel">该日期没有可展示赛事。</div>`}$('#day').onchange=()=>load($('#day').value);load('2026-09-13');
setTimeout(async()=>{if(!document.getElementById('summaryRows'))document.getElementById('events').insertAdjacentHTML('beforebegin','<div class="section">首页结论</div><section class="summary"><table><thead><tr><th>时间</th><th>联赛</th><th>比赛</th><th>结论</th><th>方向</th><th>模型盘口</th><th>市场盘口</th><th>模型总分</th><th>市场大小分</th><th>完整度</th><th>原因</th></tr></thead><tbody id="summaryRows"></tbody></table></section><div class="section">比赛详情</div>');let d=await fetch(`data/${$('#day').value}.json`,{cache:'no-store'}).then(r=>r.json());document.getElementById('summaryRows').innerHTML=(d.events||[]).map(x=>{let s=statusOf(x),p=x.pricing||{},f=p.fair_spread||{},t=p.fair_total||{},m=x.market||{},tp=(m.tape||[])[0]||{};return `<tr><td>${esc(x.event.tip_time_bj)}</td><td>${esc(x.event.league)}</td><td>${esc(x.event.match)}</td><td><b class="${s[1]==='green'?'ok':s[1]==='red'?'off':'warn'}">${s[0]}</b></td><td>${fairDirection(x,f.structural)}</td><td>${fairDirection(x,f.structural)}</td><td>${marketDirection(x,f.market,tp.selection||(m.source==='7M aggregate'?'home':null))}</td><td>${val(t.structural)}${t.structural==null?'':'分'}</td><td>${val(t.market)}${t.market==null?'':'分'}</td><td>${val(p.quality)}</td><td>${esc(primaryReason(x))}</td></tr>`}).join('')},300);
</script></body></html>
