<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>篮球量化交易 · 纸面候选</title><style>body{font-family:system-ui,"Microsoft YaHei",sans-serif;max-width:1200px;margin:auto;padding:18px;background:#f3f6f9;color:#142e40}.bar,.card{background:#fff;border:1px solid #d9e2ec;border-radius:10px;padding:16px;margin:12px 0}.paper{border:2px solid #48a77b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.pick{border:1px solid #bfe4d1;border-radius:8px;padding:10px;background:#fbfffd}.pick b{color:#136546}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:8px;border-bottom:1px solid #dce5ef}select{padding:7px 10px}.sub{color:#5b7182;font-size:13px;line-height:1.7}.warn{color:#a95b00}</style><h1>篮球量化交易 · 手动纸面候选</h1><div class="bar"><label>北京时间日期 <select id="day"><option value="2026-10-14">2026-10-14</option><option value="2026-10-13">2026-10-13</option></select></label><span class="sub">　自动执行关闭；仅供人工纸面复核</span></div><div id="app">正在载入…</div><script>
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=x=>x==null?'—':(typeof x==='number'?x.toFixed(2).replace(/\.00$/,''):esc(x));
const label=(c)=>c.market==='SPREAD'?(c.selection==='TEAM1'?'主队':'客队')+' '+(Number(c.line)>0?'+':'')+fmt(c.line):esc(c.selection)+' '+fmt(c.line);
async function load(day){const d=await fetch('basketball-data/quick-'+day+'.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json());let h=(d.history||[]).filter(x=>x.league_family);document.querySelector('#app').innerHTML='<div class="bar paper"><h2>'+d.date+' · 纸面可投 '+d.paper_bettable+' 场 / '+d.markets+' 个盘口</h2><div class="sub">赛事库存 '+d.events+' 场；盘口与实体经过规范化连续性匹配；页面为快速展示入口。</div><div class="grid">'+(d.candidates||[]).map(c=>'<div class="pick"><b>'+esc(c.team1)+' vs '+esc(c.team2)+'</b><div>'+esc(c.league)+' · '+esc(c.tip)+'</div><div class="sub">'+esc(c.market)+' · '+label(c)+' @'+fmt(c.odds)+'</div></div>').join('')+'</div></div><details class="bar" open><summary><b>同联赛历史胜率及盈亏</b></summary><div class="sub">按 league_family 汇总；同盘口类型历史优先，季前/常规/季后按 skill 规则治理。</div><table><thead><tr><th>联赛</th><th>样本</th><th>胜</th><th>负</th><th>走</th><th>胜率</th><th>盈亏(u)</th></tr></thead><tbody>'+h.map(x=>'<tr><td>'+esc(x.league_family)+'</td><td>'+fmt(x.n)+'</td><td>'+fmt(x.wins)+'</td><td>'+fmt(x.losses)+'</td><td>'+fmt(x.pushes)+'</td><td>'+((x.win_rate==null)?'—':(x.win_rate*100).toFixed(2)+'%')+'</td><td>'+fmt(x.pnl_units)+'</td></tr>').join('')+'</tbody></table></details>'};
document.querySelector('#day').onchange=e=>load(e.target.value);load('2026-10-14').catch(e=>document.querySelector('#app').innerHTML='<div class="bar warn">数据载入失败：'+esc(e.message)+'</div>');</script></html>
