:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#142e40;background:#f3f6f9}body{margin:0;padding:24px;max-width:1400px;margin:auto}h1{font-size:25px}h2{font-size:20px}h3{font-size:16px}.bar,.card{background:white;border:1px solid #d9e2ec;border-radius:10px;padding:18px;margin-bottom:16px}.sub{color:#5b7182;font-size:13px;line-height:1.8}.warn{color:#a95b00}.bad{color:#a42727}.good{color:#147457}.material-drift{color:#a42727;font-weight:800;border-left:4px solid #c33434;padding:10px 12px;background:#fff1f1}.badge{display:inline-block;padding:7px 12px;background:#fbe8e8;border-radius:6px;font-size:19px;font-weight:750}.observe{background:#fff2d6;color:#9b5900}.can{background:#d9f3e7;color:#136546}.metric{display:inline-block;padding:9px 20px 9px 0;font-size:14px}.metric b{display:block;font-size:24px}.controls{display:inline-flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid>div{background:#f6f9fc;border:1px solid #dce5ef;border-radius:6px;padding:14px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #dce5ef;white-space:nowrap}th{background:#f3f7fb}details{margin-top:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}select,button{padding:8px 12px;border:1px solid #bccad6;border-radius:5px;background:white}.foot{margin-top:20px}.missing{color:#8b650c}.lifecycle{border-left:4px solid #2878b9;padding-left:12px;margin:12px 0}.experimental{border-left-color:#a95b00}@media(max-width:720px){body{padding:12px}.grid{grid-template-columns:1fr}.metric{padding-right:12px}h1{font-size:21px}.bar,.card{padding:12px}}</style>
<h1>篮球量化交易 · 纸面模拟</h1><div class="bar"><strong>真实执行：关闭</strong>　模型：未校准研究基线　<div class="controls"><label>北京时间日期 <select id="date"></select></label><label>筛选 <select id="filter"><option value="ALL">全部赛事</option><option value="PAPER_BETTABLE">纸面可投</option><option value="TOTAL_MARKET_FOUND">有总分盘口</option><option value="TOTAL_PRICEABLE">总分可定价</option><option value="TOTAL_EDGE">总分有优势</option></select></label></div><div class="sub" id="meta">正在载入</div></div><div class="bar" id="funnel"></div><div class="bar" id="cold-start"></div><div class="bar" id="analytics"></div><div class="bar" id="pricing-funnel-diagnostic"></div><div class="bar" id="edge-funnel-diagnostic"></div><div class="bar" id="total-market-pipeline"></div><div class="bar" id="history-readiness-diagnostic"></div><div id="rows"></div><div class="sub foot">原生前向、包内核查、比分重建、旧版记录分开计数。观察/阻塞不是下注。缺少原文、方向或规则不能用近似值凑成可投。</div>
<div class="bar" id="coverage"></div><script>
const esc=x=>String(x??'未获取').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=x=>x==null?'未获取':Number(x).toFixed(2).replace(/\.00$/,'');
function fair(e,m){if(m==null)return '未获取';return esc(m>=0?e.team1_name:e.team2_name)+' '+(m===0?'平手（0分）':'让 '+num(Math.abs(m))+' 分（-'+num(Math.abs(m))+'）');}
function quoteLabel(e,q){if(q.raw_line==null)return '未获取';if(q.market_type==='TOTAL')return '总分 '+num(q.raw_line)+' 分';if(q.direction_verified&&q.line_team1!=null)return esc(e.team1_name)+' '+(q.line_team1<0?'让 ':'受让 ')+num(Math.abs(q.line_team1))+' 分（'+(q.line_team1>=0?'+':'')+num(q.line_team1)+'）';return '方向未核验（幅度 '+num(Math.abs(q.raw_line))+' 分）';}
function priceLabel(q){return q.decimal_prices?q.decimal_prices.map(num).join(' / '):'原水位 '+(q.raw_prices||[]).map(num).join(' / ')+'；格式/双边待核验';}
function selectionLabel(e,s){if(!s)return '无可执行方向';if(s.market_type==='TOTAL')return (s.selection==='OVER'?'大于 ':'小于 ')+num(s.line)+'分 @ '+num(s.decimal_odds);let team=s.selection==='TEAM1'?e.team1_name:e.team2_name;return esc(team)+' '+(s.line>=0?'+':'')+num(s.line)+' @ '+num(s.decimal_odds);}
function decisionReason(r){let a=r.execution;if(a.comparison_ready){if(a.triggered)return '独立定价与实际盘口比较后，通过纸面执行门槛';if(a.model_state==='LEAN')return '比较方向存在正期望，但未通过保守情景门槛';if(a.model_state==='NO_EDGE')return '独立定价与实际盘口比较后，没有达到正向优势';}return (r.display.reasons||[]).join('；')||'已完成纸面规则判断';}
function marketSummary(e,k,qs){const typed=qs.filter(q=>q.market_type===k&&q.raw_line!=null);if(!typed.length)return k==='TOTAL'?'暂无真实总分盘口':'暂无真实让分盘口';return typed.slice(0,8).map(q=>quoteLabel(e,q)+'；双边赔率 '+priceLabel(q)).join(' ｜ ')+(typed.length>8?' ｜ 其余 '+(typed.length-8)+' 条盘口已保留':'');}
function comparisonBlock(e,p,a,qs){let md=a.market_decisions||{};let keys=['SPREAD','TOTAL'];let blocks=keys.map(k=>{let d=md[k]||{},s=d.selected,q=s?qs.find(x=>x.quote_id===s.quote_id):null,has=qs.some(x=>x.market_type===k&&x.raw_line!=null);let model=k==='SPREAD'?fair(e,p.mu_raw):'模型总分 '+num(p.total_raw)+'分';let market=marketSummary(e,k,qs);let state=d.triggered?'纸面可投':d.comparison_ready?'已比较，未通过门槛':has?(k==='TOTAL'?'已抓到总分盘口，证据门槛未通过':'已抓到让分盘口，未通过门槛'):(k==='TOTAL'?'暂无总分盘口':'暂无让分盘口');let reason=(d.blockers||[]).join('；')||((d.uncertainty_flags||[]).join('；'));return '<section class="market-decision"><h4>'+ (k==='SPREAD'?'让分判断':'大小分判断') +'：'+state+'</h4><p><strong>独立模型：</strong>'+model+'</p><p><strong>实际盘口：</strong>'+market+'</p><p><strong>模型方向：</strong>'+selectionLabel(e,s)+'</p><p class="sub">盘口链路：'+(has?(k==='TOTAL'?'TOTAL_MARKET_FOUND':'SPREAD_MARKET_FOUND'):'MARKET_NOT_FOUND')+' ｜ 模型状态：'+esc(d.model_state||'未确认')+' ｜ 预期收益：'+num(d.ev*100)+'%'+(reason?' ｜ '+esc(reason):'')+'</p></section>';}).join('');return blocks||'<p class="missing">尚无可进行同场同规则比较的盘口。</p>';}
const dataRoot=new URL('./basketball-data/',location.href);let currentData=null;let currentFilter='ALL';
async function get(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status+' '+u);return r.json();}
function isVisible(r){if(currentFilter==='ALL')return true;const qs=r.market?.quotes||[];if(currentFilter==='PAPER_BETTABLE')return !!(r.execution&&r.execution.shadow_action==='SHADOW_BET'&&r.execution.triggered===true);if(currentFilter==='TOTAL_MARKET_FOUND')return qs.some(q=>q.market_type==='TOTAL'&&q.raw_line!=null);if(currentFilter==='TOTAL_PRICEABLE')return r.pricing?.total_raw!=null;if(currentFilter==='TOTAL_EDGE')return r.execution?.market_decisions?.TOTAL?.model_state==='EDGE';return true;}function legacyRow(r){return '<div class="card"><h2>'+esc(r.match||r.title||r.teams||r.id||'旧版历史记录')+'</h2><div class="sub">旧版迁移记录；不计入修复版验证样本。</div><details><summary>查看原始历史字段</summary><pre>'+esc(JSON.stringify(r,null,2))+'</pre></details></div>';}
function render(d){currentData=d;document.querySelector('#meta').textContent='资料类型：'+(d.archive_type||'旧版记录')+' ｜ 数据截止：'+(d.asof||d.generated_at||'未知')+' ｜ 页面生成：'+(d.generated_at||'未知')+' ｜ '+(d.message||'');
 const f=d.funnel||{};const keys=[['赛事','events'],['有盘口记录','market_observed_events'],['新鲜原始盘口','fresh_market_events'],['独立研究定价','independent_priceable_events'],['同场同规则比较','comparable_events'],['纸面触发','paper_triggered_events']];
 document.querySelector('#funnel').innerHTML=keys.map(([n,k])=>'<span class="metric">'+n+'<b>'+esc(f[k]??'—')+'</b></span>').join('')+'<div class="warn">'+(f.comparable_events>0?'已比较样本内纸面可投：'+esc(f.paper_bettable)+'场；不代表全部赛事。':'可投结论：暂不可判断，暂无同场同规则有效比较。')+'</div>';
 document.querySelector('#rows').innerHTML=(d.events||[]).filter(r=>isVisible(r)).map(r=>{if(!r.event||r.generation!=='REPAIR_V22')return legacyRow(r);let e=r.event,p=r.pricing,a=r.execution,qs=r.market.quotes||[];return '<article class="card"><h2>'+esc(e.team1_name)+' vs '+esc(e.team2_name)+'</h2><div class="sub">'+esc(e.league)+' ｜ '+esc(e.tip_time_bj)+' ｜ '+esc(e.event_id)+'</div><p><span class="badge '+(a.shadow_action==='WATCH'?'observe':a.triggered?'can':'')+'">'+esc(a.display_action)+'</span></p><p><strong>'+(a.triggered?'纸面方向：':'模型相对盘口方向：')+'</strong>'+selectionLabel(e,a.comparison_ready?a.selected:null)+'</p><div class="'+(a.triggered?'good':'bad')+'">'+esc(decisionReason(r))+'</div><div class="grid"><div><h3>独立定价</h3>独立比分基线：<b>'+fair(e,p.mu_raw)+'</b><p>模型总分：<b>'+num(p.total_raw)+'分</b>　口径：含加时比分均值</p><div class="sub">有效历史 '+esc(p.input_games??0)+' 场；证据质量 '+esc(p.pricing_data_quality??0)+'/100<br>'+esc((r.display.warnings||[]).join('；'))+'</div></div><div><h3>独立模型 vs 实际盘口</h3>'+comparisonBlock(e,p,a,qs)+'<div class="sub">这里只展示生产流水线在数据截止时冻结的比较结果；真实执行关闭。</div></div></div><details><summary>盘口原文、公司、双方水位与时效</summary><div class="tablewrap"><table><thead><tr><th>公司</th><th>盘口</th><th>价格</th><th>主/替代盘</th><th>源时间</th><th>接收时间</th><th>结算口径</th></tr></thead><tbody>'+qs.map(q=>'<tr><td>'+esc(q.bookmaker||q.bookmaker_id)+'</td><td>'+quoteLabel(e,q)+'</td><td>'+priceLabel(q)+'</td><td>'+esc(q.main_or_alt)+'</td><td>'+esc(q.source_quote_at)+'</td><td>'+esc(q.received_at)+'</td><td>'+(q.ot_rule==='INCLUDING_OT'?'含加时（纸面口径）':esc(q.ot_rule))+'</td></tr>').join('')+'</tbody></table></div></details><details><summary>输入证据与技术审计</summary><pre>'+esc(JSON.stringify({pricing:p,execution:a,identity:e},null,2))+'</pre></details></article>';}).join('')||(currentFilter==='PAPER_BETTABLE'?'<div class="card">当前日期没有纸面可投赛事。</div>':'<div class="card">本日期没有可显示记录。请检查采集错误，不能将此解释为全球没有比赛。</div>');}
 (async()=>{try{const filter=document.querySelector('#filter');filter.value=currentFilter;filter.onchange=()=>{currentFilter=filter.value;if(currentData)render(currentData)};if(window.__AUDIT_DATA__){document.querySelector('#date').innerHTML='<option>包内核查</option>';render(window.__AUDIT_DATA__);return;}const index=await get(new URL('index.json',dataRoot));const entries=(index.dates||[]).map(x=>typeof x==='string'?{date:x,file:x+'.json'}:x);const sel=document.querySelector('#date');sel.innerHTML=entries.map(x=>'<option value="'+esc(x.file||x.date+'.json')+'">'+esc(x.date)+'</option>').join('');sel.onchange=async()=>{try{render(await get(new URL(sel.value,dataRoot)))}catch(e){document.querySelector('#meta').textContent=e.message}};const latest=await get(new URL('latest.json',dataRoot));sel.value=(latest.date_bj||latest.date||'')+'.json';render(latest);}catch(e){document.querySelector('#meta').textContent='数据载入失败：'+e.message+'；本地预览请通过HTTP服务，不要双击在线版HTML。'}})();
const renderBase=render;
render=function(d){renderBase(d);const visible=(d.events||[]).filter(r=>isVisible(r));document.querySelectorAll('#rows > .card').forEach((card,i)=>{const r=visible[i];if(!r?.execution?.triggered)return;const s=r.settlement;const node=document.createElement('p');node.className='paper-settlement';node.textContent=s?'纸面结算：'+({WIN:'赢',LOSS:'输',PUSH:'走水'}[s.outcome]||'待核验')+' ｜ '+r.event.team1_name+' '+s.score1+' : '+s.score2+' '+r.event.team2_name+' ｜ 纸面盈亏 '+num(s.paper_pnl)+'U':'纸面结算：待确认终场赛果';card.insertBefore(node,card.querySelector('.grid'));});};
const renderWithSettlement=render;
render=function(d){renderWithSettlement(d);const visible=(d.events||[]).filter(r=>isVisible(r));document.querySelectorAll('#rows > .card').forEach((card,i)=>{
 const r=visible[i], c=r?.current_snapshot;if(!c)return;
 const grid=card.querySelector('.grid');if(!grid)return;
 const badge=card.querySelector('.badge');if(badge)badge.textContent+='（首写记录）';
 grid.querySelectorAll('h3').forEach(h=>h.textContent='首写纸面记录 · '+h.textContent);
 grid.innerHTML=grid.innerHTML.replace('实际盘口：</strong>','首写盘口：</strong>');
 const old=card.querySelector('details > summary');if(old)old.textContent='首写盘口证据（回测依据，不代表当前盘口）';
 const panel=document.createElement('section');panel.className='current-market';
 const qs=c.market?.quotes||[], states=c.market?.quote_states||[], fresh=states.some(s=>s.fresh_observation);
 const rv=c.execution?.market_revalidation||{};
 const rvText={STILL_QUALIFIES:'原纸面方向仍符合条件',NO_LONGER_QUALIFIES:'原纸面方向本轮不再符合条件',REVALIDATION_UNAVAILABLE:'原纸面方向本轮无法复核',EVENT_STARTED:'比赛已开始，进入结算跟踪'}[rv.status]||'本轮复核状态未提供';
 const drift=rv.market_difference,oldSelection=rv.original_selection||{},currentSelection=rv.current_selected||{};
 const movement={FAVORABLE:'对原方向更有利',ADVERSE:'对原方向不利',UNCHANGED:'无变化',UNKNOWN:'方向待核验'};
 const driftText=drift?'首写 '+selectionLabel(c.event,oldSelection)+' → 当前 '+selectionLabel(c.event,currentSelection)+'；盘口变化：'+(movement[drift.line_direction]||'方向待核验')+'；赔率变化：'+(movement[drift.odds_direction]||'方向待核验'):'';
 const failed=rv.status==='NO_LONGER_QUALIFIES',driftClass=(drift&&drift.material&&failed)?'material-drift':(drift&&drift.material&&drift.line_direction==='FAVORABLE')?'good':(drift&&drift.material)?'warn':'sub';
 const driftLead=(drift&&drift.material&&failed)?'真实盘口差异过大，经重新审核后本轮不投注。':(drift&&drift.material&&drift.line_direction==='FAVORABLE')?'当前盘口对原方向更有利，仍须以本轮门槛复核。':(drift&&drift.material)?'盘口变化较大，已按本轮同规则报价重新审核。':'';
 panel.innerHTML='<h3>本轮实际盘口与纸面复核</h3><p><strong>复核结论：</strong>'+esc(rvText)+'</p>'+(drift?'<p class="'+driftClass+'">'+esc(driftLead+driftText)+'</p>':'')+'<p class="sub">仅比较原纸面单的同公司、同市场、同方向、同加时规则。'+esc(rv.display||'')+' ｜ 本轮截止：'+esc(c.asof)+' ｜ '+(fresh?'存在通过时效检查的报价':'暂无通过时效检查的报价，不使用首写盘口代替')+'</p>'+(rv.current_selected?'<p><strong>原方向本轮报价：</strong>'+selectionLabel(c.event,rv.current_selected)+'</p>':'')+(qs.length?'<div class="tablewrap"><table><thead><tr><th>公司</th><th>当前盘口</th><th>双方赔率</th><th>主/替代盘</th><th>源报价时间</th><th>本轮接收时间</th></tr></thead><tbody>'+qs.map(q=>'<tr><td>'+esc(q.bookmaker||q.bookmaker_id)+'</td><td>'+quoteLabel(c.event,q)+'</td><td>'+priceLabel(q)+'</td><td>'+esc(q.main_or_alt)+'</td><td>'+esc(q.source_quote_at)+'</td><td>'+esc(q.received_at)+'</td></tr>').join('')+'</tbody></table></div>':'<p>本轮未获取同场盘口；首写纸面单继续保留跟踪。</p>');
 card.insertBefore(panel,grid);
 });};
function renderCoverage(c){const box=document.querySelector('#coverage');if(!box)return;if(!c){box.innerHTML='<strong>全球赛事覆盖</strong><p class="sub">本轮未生成全球发现漏斗。</p>';return;}const o=c.overall||{};const labels=[['发现赛事','discovered'],['找到盘口','market_found'],['完成定价','priceable'],['Shadow','shadow'],['Executable','executable']];box.innerHTML='<h2>全球赛事覆盖</h2>'+labels.map(x=>'<span class="metric">'+x[0]+'<b>'+esc(o[x[1]]??0)+'</b></span>').join('')+'<p class="sub">地区：'+Object.entries(c.by_region||{}).map(([k,v])=>esc(k)+' '+esc(v.discovered)+'/'+esc(v.market_found)+'/'+esc(v.priceable)+'/'+esc(v.shadow)+'/'+esc(v.executable)).join(' ｜ ')+'</p><details><summary>未覆盖赛事诊断</summary><pre>'+esc(JSON.stringify(c.uncovered_events||[],null,2))+'</pre></details>';}
const renderWithCurrentMarket=render;
function renderAnalytics(a){const box=document.querySelector('#analytics');if(!box)return;if(!a){box.innerHTML='<strong>信号与执行统计</strong><p class="sub">尚未生成仅基于不可变首写的信号/执行/价格透支审计。</p>';return;}const s=a.spread_signal_layer||{},e=a.spread_execution_layer||{},x=a.price_exhaustion_layer||{},t=a.total_diagnostic_layer||{};box.innerHTML='<h2>首写信号、纸面执行与总分诊断</h2><span class="metric">让分首写方向<b>'+esc(s.signals??0)+'</b></span><span class="metric">让分信号结果<b>'+esc((s.signal_wins??0)+' / '+(s.signal_losses??0)+' / '+(s.signal_pushes??0))+'</b></span><span class="metric">纸面执行<b>'+esc(e.executed??0)+'</b></span><span class="metric">价格透支（已证实）<b>'+esc(x.count??0)+'</b></span><span class="metric">总分已结算诊断<b>'+esc(t.settled_total_observations??0)+'</b></span><p class="sub">信号结果只描述冻结的首写方向，不是策略胜率。纸面盈亏只计触发的纸面条目。价格透支必须有同公司、同市场、同方向、同加时规则的前后复核证据；缺失盘口不会被猜成透支。总分目前仅为实验性诊断，不用于参数、概率、Kelly 或执行门槛。</p>';}
render=function(d){renderWithCurrentMarket(d);renderAnalytics(d.analytics);const records=new Map(((d.analytics||{}).records||[]).map(x=>[x.prediction_id,x]));const failures=new Map((((d.analytics||{}).failure_audit_layer||{}).records||[]).map(x=>[x.prediction_id,x]));const failureSummary=(d.analytics||{}).failure_audit_layer||{};const visible=(d.events||[]).filter(r=>isVisible(r));const analytics=document.querySelector('#analytics');if(analytics&&failureSummary.count){analytics.insertAdjacentHTML('beforeend','<p class="sub"><strong>结算错因审计：</strong>已追加 '+esc(failureSummary.count)+' 条；'+esc(JSON.stringify(failureSummary.counts||{}))+'。缺少量化证据的失败明确标记为“错因未确认：数据不足”。</p>')}document.querySelectorAll('#rows > .card').forEach((card,i)=>{const row=visible[i],record=records.get(row?.execution?.prediction_id);if(!row?.event)return;const p=row.pricing||{},life=row.execution?.execution_lifecycle||record;const total=(row.current_snapshot?.pricing?.total_diagnostic)||p.total_diagnostic;if(life){const panel=document.createElement('section');panel.className='lifecycle';panel.innerHTML='<h3>信号与纸面执行跟踪</h3><p><strong>首写阶段：</strong>'+esc(life.entry_phase||'历史首写待分类')+' ｜ <strong>阈值来源：</strong>'+esc(life.threshold_source||'INITIAL_PRIOR')+'</p><p class="sub">首写方向和首写价格不可改写。临场只会追加复核记录；若价格移动后不再满足条件，也不会抹去已存在的早盘纸面条目。</p>';card.insertBefore(panel,card.querySelector('.grid'));}if(total){const panel=document.createElement('section');panel.className='lifecycle experimental';const executable=total.execution_eligible?'总分证据齐全，可进入后续纸面比较':'总分证据未齐全，仅观察，不进入纸面执行';panel.innerHTML='<h3>总分证据诊断</h3><p>常规时间：'+esc(total.game_minutes??'未确认')+' 分 ｜ 近期总分均值：'+num(total.recent_total_mean)+' ｜ 胶着局末节样本：'+num(total.close_game_q4_observations)+' ｜ 大分差末节样本：'+num(total.blowout_q4_observations)+'</p><p><strong>'+esc(executable)+'</strong></p><p class="sub">'+esc((total.uncertainty_flags||[]).join('；'))+'。回合数、三分、末节犯规和阵容信息必须来自可核验来源；缺项不会被比分均值替代。</p>';card.appendChild(panel);}const failure=failures.get(row.execution?.prediction_id);if(failure){const panel=document.createElement('section');panel.className='lifecycle experimental';const label=failure.failure_label==='CAUSE_UNKNOWN_INSUFFICIENT_DATA'?'错因未确认：数据不足':failure.failure_label;panel.innerHTML='<h3>结算错因审计</h3><p><strong>'+esc(label)+'</strong></p><p>'+esc(failure.reasoning_chain||'')+'</p><p class="sub">指标：'+esc(failure.hard_evidence?.metric_name)+' = '+esc(failure.hard_evidence?.metric_value)+' ｜ 阈值：'+esc(failure.hard_evidence?.threshold_triggered)+' ｜ 审计：'+(failure.audit_passed?'通过':'未通过')+'</p>';card.appendChild(panel);}});};
function renderPricingFunnelDiagnostic(x){const box=document.querySelector('#pricing-funnel-diagnostic');if(!box)return;if(!x){box.innerHTML='<h2>定价漏斗诊断</h2><p class="sub">本日期没有生成定价漏斗诊断。</p>';return;}const m=x.markets||{},s=x.stage_counts||{},top=x.top_blockers||[];const rows=Object.entries(m).map(([k,v])=>'<tr><td>'+esc(k==='SPREAD'?'让分':'大小分')+'</td><td>'+esc(v.events_total??0)+'</td><td>'+esc(v.market_found??0)+'</td><td>'+esc(v.no_market??0)+'</td><td>'+esc(v.fresh_market??0)+'</td><td>'+esc(v.stale_market??0)+'</td><td>'+esc(v.priceable??0)+'</td><td>'+esc(v.fresh_market_but_not_priceable??0)+'</td></tr>').join('');const blockers=top.length?top.slice(0,8).map(b=>'<li><strong>'+esc(b.reason)+'</strong>：'+esc(b.count)+'，'+esc(b.text)+'（'+esc(b.category)+'）</li>').join(''):'<li>暂无阻塞记录</li>';box.innerHTML='<details open><summary><strong>定价漏斗诊断</strong>　市场记录 '+esc(x.market_records??0)+'　终态核算：'+esc(x.terminal_accounting_status||'未确认')+'　瓶颈：'+esc((x.bottleneck||[])[0]||'未确认')+'</summary><p class="sub">只读诊断：不修改公平盘口、概率、sigma、证据门槛或执行决定。新鲜盘口是进入历史与模型分支的前置条件。</p><div class="tablewrap"><table><thead><tr><th>市场</th><th>赛事总数</th><th>找到盘口</th><th>无盘口</th><th>新鲜盘口</th><th>过期盘口</th><th>可定价</th><th>新鲜但未定价</th></tr></thead><tbody>'+rows+'</tbody></table></div><p><strong>主要瓶颈：</strong>'+esc(JSON.stringify(s))+'</p><p><strong>Top 阻塞原因</strong></p><ul>'+blockers+'</ul><details><summary>查看逐场漏斗终态与历史明细</summary><pre>'+esc(JSON.stringify(x.records||[],null,2))+'</pre></details><details><summary>查看工程分类与修复优先级</summary><p>工程失败：'+esc(x.engineering_failures??0)+'；真实数据缺失：'+esc(x.genuine_data_absence??0)+'；模型限制：'+esc(x.model_limitations??0)+'；主动风控：'+esc(x.intentional_risk_blocks??0)+'</p><pre>'+esc(JSON.stringify(x.repair_priorities||{},null,2))+'</pre></details></details>'}
function renderEdgeFunnelDiagnostic(x){const box=document.querySelector('#edge-funnel-diagnostic');if(!box)return;if(!x||!x.edge_funnel){box.innerHTML='<h2>Edge 漏斗诊断</h2><p class="sub">本日期没有生成 Edge 漏斗诊断。</p>';return;}const ef=x.edge_funnel||{},ms=ef.markets||{};const val=(v)=>v==null?'—':esc(v);const stageRows=['SPREAD','TOTAL'].map(k=>{const v=ms[k]||{};return '<tr><td><strong>'+esc(k==='SPREAD'?'让分':'大小分')+'</strong></td><td>'+val(v.market_found)+'</td><td>'+val(v.fresh_market)+'</td><td>'+val(v.research_priceable)+'</td><td>'+val(v.market_comparable)+'</td><td>'+val(v.raw_edge_found)+'</td><td>'+val(v.calibrated_edge_found)+'</td><td>'+val(v.evidence_pass)+'</td><td>'+val(v.execution_pass)+'</td><td>'+val(v.shadow_triggered)+'</td></tr>';}).join('');const reasons=Object.entries(ef.primary_final_reasons||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+esc(v)+'</td><td>'+esc((window.REASON_TEXT&&window.REASON_TEXT[k])||k)+'</td></tr>').join('')||'<tr><td colspan="3">暂无可比较样本</td></tr>';const r=ef.retention||{};const groups=Object.entries(ef.retention_by_group||{}).map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+val(v.sample_size)+'</td><td>'+val(v.mean_edge_retention)+'</td><td>'+val(v.median_edge_retention)+'</td><td>'+esc(v.possible_over_shrinkage?'是':'否')+'</td></tr>').join('')||'<tr><td colspan="5">暂无带有明确校准公平线的样本；不会从市场融合值反推校准 Edge。</td></tr>';const details=(x.comparable_edge_rows||[]).map(v=>'<tr><td>'+esc(v.game_id||'')+'</td><td>'+esc(v.league||'')+'</td><td>'+esc(v.market_type==='SPREAD'?'让分':'大小分')+'</td><td>'+val(v.raw_fair_line)+'</td><td>'+val(v.market_line)+'</td><td>'+val(v.raw_edge_points)+'</td><td>'+val(v.calibrated_edge_points)+'</td><td>'+val(v.edge_retention_ratio)+'</td><td>'+esc(v.primary_final_reason||'')+'</td></tr>').join('')||'<tr><td colspan="9">暂无逐场可比较样本</td></tr>';const zero=Number(ef.markets?.SPREAD?.shadow_triggered||0)+Number(ef.markets?.TOTAL?.shadow_triggered||0)===0;box.innerHTML='<details open><summary><strong>Edge 漏斗诊断（只读）</strong>　可比较 '+val(ef.comparable_total)+'　Raw Edge '+val((ms.SPREAD?.raw_edge_found||0)+(ms.TOTAL?.raw_edge_found||0))+'　校准后 Edge '+val((ms.SPREAD?.calibrated_edge_found||0)+(ms.TOTAL?.calibrated_edge_found||0))+'　纸面触发 '+val((ms.SPREAD?.shadow_triggered||0)+(ms.TOTAL?.shadow_triggered||0))+'</summary><p class="sub">该区域只解释真实 pipeline 的损失位置，不修改公平盘口、概率、残差、证据门槛或纸面决定。校准公平线未由生产模型明确输出时保持缺失。</p><div class="tablewrap"><table><thead><tr><th>市场</th><th>有盘口</th><th>新鲜</th><th>独立定价</th><th>同场比较</th><th>Raw Edge</th><th>校准后 Edge</th><th>Evidence</th><th>Execution</th><th>纸面触发</th></tr></thead><tbody>'+stageRows+'</tbody></table></div>'+(zero?'<h3>今日为什么 0 场纸面触发</h3><p>可比较样本：'+val(ef.comparable_total)+'。下面是每个可比较样本的唯一首要终态原因。</p><div class="tablewrap"><table><thead><tr><th>Primary Final Reason</th><th>数量</th><th>说明</th></tr></thead><tbody>'+reasons+'</tbody></table></div>':'')+'<h3>校准收缩诊断</h3><p>样本数 '+val(r.sample_size)+'；Edge retention 均值 '+val(r.mean_edge_retention)+'；中位数 '+val(r.median_edge_retention)+'；可能过度收缩：'+esc(r.possible_over_shrinkage?'是':'否')+'。该结论仅用于审计，不自动调参。</p><div class="tablewrap"><table><thead><tr><th>分组</th><th>样本</th><th>均值</th><th>中位数</th><th>可能过度收缩</th></tr></thead><tbody>'+groups+'</tbody></table></div><details><summary>查看可比较样本 Edge 明细</summary><div class="tablewrap"><table><thead><tr><th>赛事</th><th>联赛</th><th>市场</th><th>Raw公平线</th><th>市场线</th><th>Raw Edge</th><th>校准 Edge</th><th>保留率</th><th>首要原因</th></tr></thead><tbody>'+details+'</tbody></table></div></details></details>';}function renderEdgeDropoffDiagnostic(x){const box=document.querySelector('#edge-funnel-diagnostic');if(!box||!x||!x.edge_funnel)return;const ms=x.edge_funnel.markets||{};const rows=['SPREAD','TOTAL'].map(k=>{const v=ms[k]||{};const rs=Object.entries(v.priceable_not_comparable_reasons||{}).map(([r,n])=>esc(r)+' '+esc(n)).join('；')||'—';return '<tr><td>'+esc(k==='SPREAD'?'让分':'大小分')+'</td><td>'+esc(v.research_priceable??0)+'</td><td>'+esc(v.market_comparable??0)+'</td><td>'+esc(v.not_comparable??0)+'</td><td>'+rs+'</td></tr>';}).join('');box.insertAdjacentHTML('beforeend','<details><summary><strong>Research Priceable → Market Comparable 逐层去向</strong></summary><p class="sub">这里解释研究定价样本为什么没有进入同场同规则比较；每个 market_type 使用唯一首要原因。</p><div class="tablewrap"><table><thead><tr><th>市场</th><th>独立定价</th><th>可比较</th><th>未比较</th><th>Primary Final Reason</th></tr></thead><tbody>'+rows+'</tbody></table></div></details>');}function renderHistoryReadinessDiagnostic(x){const box=document.querySelector('#history-readiness-diagnostic');if(!box)return;if(!x){box.innerHTML='<h2>历史数据就绪诊断</h2><p class="sub">本日期没有生成球队历史瀑布。</p>';return;}const w=x.waterfall||{};const rows=(x.teams||[]).slice(0,80).map(t=>'<tr><td>'+esc(t.raw_team_name||'未确认')+'</td><td>'+esc(t.league||'')+'</td><td>'+esc(t.raw_games_found??0)+'</td><td>'+esc(t.games_after_league_filter??0)+'</td><td>'+esc(t.games_before_cutoff??0)+'</td><td>'+esc(t.usable_history_games??0)+' / '+esc(t.minimum_required_games??0)+'</td><td>'+esc(t.primary_history_failure||'READY')+'</td></tr>').join('');box.innerHTML='<details><summary><strong>历史数据就绪诊断</strong>　球队 '+esc(x.team_count??0)+'　可用 '+esc(w.usable??0)+'　解析历史 '+esc(x.raw_games_parsed??0)+'</summary><p class="sub">瀑布：原始 '+esc(w.raw_history??0)+' → 别名 '+esc(w.team_alias_matched??0)+' → 联赛 '+esc(w.league_matched??0)+' → 截止前 '+esc(w.pre_cutoff??0)+' → 有效 '+esc(w.valid??0)+' → 去重 '+esc(w.deduplicated??0)+' → 可用 '+esc(w.usable??0)+'。该区域只读，不放宽历史最低场次。</p><div class="tablewrap"><table><thead><tr><th>球队</th><th>联赛</th><th>原始</th><th>联赛过滤后</th><th>截止前</th><th>可用/最低</th><th>首要原因</th></tr></thead><tbody>'+rows+'</tbody></table></div><details><summary>查看逐场球队历史</summary><pre>'+esc(JSON.stringify(x.events||[],null,2))+'</pre></details><p class="sub">来源失败：'+esc(x.source_failed_teams??0)+'；联赛过滤移除：'+esc(x.raw_history_exists_but_removed_by_league_filter??0)+'；日期过滤拒绝：'+esc(x.date_filter_rejected??0)+'；fallback：'+esc(JSON.stringify(x.fallback_audit||{}))+'</p></details>'}
function renderColdStart(x){const box=document.querySelector('#cold-start');if(!box||!x)return;const vals=Object.values(x.leagues||{});const rows=vals.map(v=>'<tr><td>'+esc(v.league_family)+'</td><td>'+esc(v.discovered)+'</td><td>'+esc(v.market_found)+'</td><td>'+esc(v.current_season_history)+'</td><td>'+esc(v.previous_season_history)+'</td><td>'+esc(v.effective_sample_size_min==null?'—':Number(v.effective_sample_size_min).toFixed(2))+'</td><td>'+esc(v.research_priceable)+'</td><td>'+esc(v.cold_start_priceable)+'</td><td>'+esc(v.shadow_eligible)+'</td></tr>').join('');box.innerHTML='<h2>冷启动 / Bootstrap 定价</h2><p class="sub">冷启动仅增加研究覆盖；ESS、阵容连续性和原有证据/Edge门槛未通过时，不进入纸面执行。真实执行永久关闭。</p><div class="tablewrap"><table><thead><tr><th>联赛</th><th>发现</th><th>盘口</th><th>本季历史</th><th>前季历史</th><th>最低ESS</th><th>研究定价</th><th>冷启动定价</th><th>Shadow</th></tr></thead><tbody>'+rows+'</tbody></table></div>';}function renderTotalMarketPipeline(x){const box=document.querySelector('#total-market-pipeline');if(!box)return;if(!x){box.innerHTML='<h2>总分盘口全链路审计</h2><p class="sub">本日期没有生成总分盘口审计。</p>';return;}const c=x.counts||{},f=x.failure_counts||{};box.innerHTML='<details open><summary><strong>总分盘口全链路审计</strong>　已抓到 '+esc(c.raw_total_market_found??0)+' 场　新鲜 '+esc(c.fresh_total_market_found??0)+' 场　可定价 '+esc(c.total_priceable??0)+' 场　纸面触发 '+esc(c.total_shadow_eligible??0)+' 场</summary><p class="sub">盘口存在不等于可以投注：总分报价先保留，再分别经过新鲜度、独立定价、证据、优势和纸面执行门槛。没有被选为纸面方向的总分报价不会被隐藏。</p><p class="sub">RAW/PARSED：'+esc(c.raw_total_market_found??0)+' / '+esc(c.parsed_total_market_found??0)+'；NORMALIZED/CANONICAL：'+esc(c.normalized_total_market_found??0)+' / '+esc(c.canonical_total_market_found??0)+'；FRESH/PRICEABLE：'+esc(c.fresh_total_market_found??0)+' / '+esc(c.total_priceable??0)+'；EVIDENCE/EDGE/SHADOW：'+esc(c.total_evidence_complete??0)+' / '+esc(c.total_edge_found??0)+' / '+esc(c.total_shadow_eligible??0)+'</p><details><summary>查看逐场总分审计</summary><pre>'+esc(JSON.stringify(x.records||[],null,2))+'</pre></details><p class="sub">首要阻塞：'+esc(JSON.stringify(f))+'</p></details>';}const renderWithCoverage=render;render=function(d){renderTotalMarketPipeline(d.total_market_pipeline_diagnostic);renderWithCoverage(d); renderCoverage(d.coverage);renderPricingFunnelDiagnostic(d.pricing_funnel_diagnostic);renderEdgeFunnelDiagnostic(d.pricing_funnel_diagnostic);renderEdgeDropoffDiagnostic(d.pricing_funnel_diagnostic);renderHistoryReadinessDiagnostic(d.history_readiness_diagnostic||d.pricing_funnel_diagnostic?.history_readiness);};

const _renderWithScoreContext=render;render=function(d){_renderWithScoreContext(d);const visible=(d.events||[]).filter(r=>typeof isVisible==='function'?isVisible(r):true);document.querySelectorAll('#rows > .card').forEach((card,i)=>{const row=visible[i],t=row?.pricing?.total_diagnostic?.recent_score_context||row?.pricing?.recent_score_context;if(!t)return;const teams=Object.values(t.team_context||{}).map(v=>{const w5=v.windows?.last_5||{},w10=v.windows?.last_10||{},q=w5.period_total_points||{};return '<tr><td>'+esc(v.team_name||'球队')+'</td><td>'+esc(w5.games??0)+' / '+esc(w10.games??0)+'</td><td>'+num(w5.total_points?.mean)+' / '+num(w10.total_points?.mean)+'</td><td>'+['Q1','Q2','Q3','Q4'].map(k=>num(q[k]?.mean)).join(' / ')+'</td><td>'+num(w5.score_volatility?.total_stdev)+'</td><td>'+esc(w5.games_in_14_days??0)+'</td></tr>';}).join('');const panel=document.createElement('section');panel.className='lifecycle experimental';panel.innerHTML='<h3>近况、分节与赛程波动（总分证据）</h3><p class="sub">仅使用截止时间前已确认的最近5/10场终场比分和分节比分；胶着局阈值为赛前Q4分差≤8分，大分差阈值为≥15分。回合数、三分率、犯规率、伤停和旅行不从比分倒推。</p><div class="tablewrap"><table><thead><tr><th>球队</th><th>近5/近10场</th><th>总分均值</th><th>Q1/Q2/Q3/Q4总分</th><th>近5总分波动</th><th>14日场次</th></tr></thead><tbody>'+teams+'</tbody></table></div><p class="sub">证据状态：'+esc(t.status||'未确认')+'；来源：'+esc(t.method||'未确认')+'；'+esc(t.schedule_context||'')+'</p>';card.appendChild(panel);});};
